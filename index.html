<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>보험 하루 한 이슈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 계리 노트 한 장: 좁은 단일 열, 단계마다 번호(실제 순서), 숫자는 고정폭 */
:root{
  --paper:#F5F6F3; --card:#FFFFFF; --ink:#1B2421; --ink-2:#56625D; --line:#DCE1DD;
  --accent:#17624F; --accent-bg:#E3EFEA; --warm:#9A5B12; --warm-bg:#F6EBDC;
  --good:#1E7A45; --bad:#B23A30;
  --f-disp:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121816; --card:#1A2220; --ink:#E6ECE9; --ink-2:#9DABA5; --line:#2C3633;
  --accent:#6FC7AA; --accent-bg:#1D3A31; --warm:#E3A85C; --warm-bg:#3A2B17;
  --good:#6FCB92; --bad:#F08A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121816; --card:#1A2220; --ink:#E6ECE9; --ink-2:#9DABA5; --line:#2C3633;
  --accent:#6FC7AA; --accent-bg:#1D3A31; --warm:#E3A85C; --warm-bg:#3A2B17;
  --good:#6FCB92; --bad:#F08A80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--line);padding-bottom:20px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand b{font-family:var(--f-disp);font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand select{font:inherit;font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.tag{font-size:13px;color:var(--accent);background:var(--accent-bg);padding:2px 10px;border-radius:99px;align-self:flex-start}
h1{font-family:var(--f-disp);font-size:clamp(24px,5vw,30px);line-height:1.35;margin:0;text-wrap:balance;font-weight:700}
.meta{font-size:14px;color:var(--ink-2)}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sh{display:flex;align-items:baseline;gap:10px}
.sh .n{font-family:var(--f-num);font-size:13px;color:var(--accent)}
.sh h2{font-size:15px;font-weight:600;margin:0;color:var(--ink-2)}
.q{margin:0;font-size:17px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:15px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--card)}
button.picked{border-color:var(--accent);background:var(--accent-bg)}
.reveal{background:var(--paper);border-radius:10px;padding:14px 16px;font-size:15px;color:var(--ink-2);white-space:pre-wrap}
.reveal strong{color:var(--ink)}
.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}
.predict{border-color:var(--warm)} .predict .sh .n{color:var(--warm)}
textarea{width:100%;min-height:96px;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);resize:vertical}
.err{font-size:13px;color:var(--bad)}
.gauge{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gauge div{background:var(--paper);border-radius:10px;padding:10px 12px}
.gauge span{display:block;font-size:13px;color:var(--ink-2)}
.gauge em{font-style:normal;font-family:var(--f-num);font-size:22px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.chain{display:flex;flex-direction:column;gap:0}
.link{padding:10px 14px;border-left:2px solid var(--accent);font-size:15px}
.link+.link{border-top:1px dashed var(--line)}
.fb{font-size:15px;white-space:pre-wrap;background:var(--accent-bg);border-radius:10px;padding:14px 16px}
.small{font-size:13px;color:var(--ink-2)}
.src a{color:var(--accent)}
.empty{text-align:center;color:var(--ink-2);padding:48px 0}
@media (max-width:420px){.gauge{grid-template-columns:1fr}.step{padding:16px}}
@media (prefers-reduced-motion:no-preference){.reveal,.fb,.link{animation:in .25s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><b>보험 하루 한 이슈</b><select id="pick" aria-label="날짜 고르기"></select></div>
    <div id="head"><p class="empty" style="padding:8px 0">이슈를 불러오는 중이에요.</p></div>
  </header>
  <main id="main" class="wrap" style="gap:20px"></main>
</div>
<script src="issues.js"></script>
<script src="app.js"></script>
</body>
</html>

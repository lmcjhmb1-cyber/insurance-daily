<style>
/* 업무 도구처럼 정돈된 화면: 위쪽 갈색 띠 메뉴, 굵은 제목과 얇은 선, 각진 모서리, 갈색은 강조에만 */
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --paper:#F3F3EC; --line:#DCD8CC; --line-2:#1F1A17;
  --ink:#1F1A17; --ink-2:#6B635C; --ink-3:#9C958C;
  --accent:#552518; --accent-ink:#552518; --accent-bg:#F3EAE4; --fill:#552518;
  --warm:#3F5560; --warm-bg:#EFF3F4;--mark:#FFE7A0; --good:#047857; --bad:#C2410C;
  --f-body:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-disp:"Wanted Sans Variable","Wanted Sans","Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; --f-num:var(--f-disp);
  --top:#552518; --on-top:#F3F3EC; --on-fill:#FFFFFF; --slate:#3F5560; --slate-bg:#EFF3F4; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161413; --card:#1E1B19; --paper:#272320; --line:#36302C; --line-2:#F3F3EC;
  --ink:#F3F3EC; --ink-2:#BDB4AA; --ink-3:#857C73;
  --accent:#A8705A; --accent-ink:#E2C2B2; --accent-bg:#3A2820; --fill:#D2A894;
  --warm:#A9C0CA; --warm-bg:#1F2A2F;--mark:rgba(245,181,101,.32); --good:#6EE7B7; --bad:#FB923C;
  --top:#2A1712; --on-top:#F3F3EC; --on-fill:#161413; --slate:#A9C0CA; --slate-bg:#1F2A2F; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word;font-feature-settings:"tnum"}
a{color:inherit}
button,select,input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}


/* 본문 틀 */
.wrap{padding-top:28px;padding-bottom:72px;display:flex;flex-direction:column;gap:24px}
#head{display:flex;flex-direction:column;gap:10px}
#head:empty{display:none}
h1{font-size:28px;line-height:1.35;margin:0;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.meta{font-size:14.5px;color:var(--ink-2);margin:0}
.back{font-size:13.5px;color:var(--ink-2);text-decoration:none;align-self:flex-start}
.back:hover{color:var(--ink)}
main{display:flex;flex-direction:column;gap:20px}
.small{font-size:13px;color:var(--ink-2)}
.small a{color:var(--accent-ink)}
.empty{text-align:center;color:var(--ink-2);padding:40px 0}
.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}

/* 단추와 입력 */
button{font-size:14.5px;padding:9px 16px;border-radius:2px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:left;font-weight:500}
button:hover{border-color:var(--ink-3)}
button:disabled{opacity:.55;cursor:default}
button.pri{background:var(--fill);border-color:var(--fill);color:var(--bg);font-weight:700}
button.pri:hover{opacity:.9}
button.picked{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-ink);font-weight:600}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
select,input[type=search]{font-size:14.5px;padding:8px 12px;border-radius:2px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=search]{width:100%;padding:11px 14px}
textarea{width:100%;min-height:96px;font-size:15px;padding:11px 13px;border-radius:2px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical;line-height:1.6}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.err{font-size:13px;color:var(--bad)}
.err:empty{display:none}

/* 꼬리표 */
.chip{font-size:13px;font-weight:600;color:var(--accent-ink);text-decoration:none}
.chip:hover{text-decoration:underline}

/* 오늘 이슈 목록 */
.dcal{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:2px;padding:12px 12px 14px;max-width:460px}
.dcal[hidden]{display:none}
.dch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.dch b{font-size:15.5px;font-weight:800}
.dtitle{white-space:nowrap;width:auto;height:auto;flex:0 1 auto;border:0;background:transparent;color:var(--ink);font-size:15.5px;font-weight:800;padding:6px 10px;border-radius:2px;cursor:pointer}
.dtitle:hover{background:var(--paper)}
.dtitle span{font-size:11px;color:var(--ink-3)}
.dmgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dm{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:2px;border:1px solid transparent;background:var(--paper);color:var(--ink);cursor:pointer;line-height:1.2}
.dm b{font-size:14px;font-weight:700}
.dm i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--ink-2)}
.dm:hover:not(:disabled){border-color:var(--accent)}
.dm:disabled{background:transparent;color:var(--ink-3);cursor:default}.dm:disabled b{font-weight:500}
.dm.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dm.sel{background:var(--fill);color:var(--bg);border-color:var(--fill)}
.dm.sel i{color:var(--bg)}
.dch button:not(.dtitle){width:36px;height:34px;border-radius:2px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.dch button:disabled{opacity:.3;cursor:default}
.dgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dw{text-align:center;font-size:12px;font-weight:600;color:var(--ink-2);padding:4px 0}
.dd{position:relative;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:2px;text-decoration:none;color:var(--ink);line-height:1.2;border:1px solid transparent}
.dd b{font-size:14px;font-weight:700}
.dd i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--ink-2)}
.dd.blank{pointer-events:none}
.dd.none{color:var(--ink-3)}.dd.none b{font-weight:500}
.dw.sun,.dd.sun b{color:var(--bad)}
.dd.none.sun b{opacity:.6}
a.dd{background:var(--paper)}
a.dd:hover{border-color:var(--accent)}
a.dd.part{background:color-mix(in srgb,var(--accent) 16%,var(--card))}
a.dd.all{background:color-mix(in srgb,var(--accent) 34%,var(--card))}
a.dd.all i{color:var(--accent-ink)}
.dd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dd.sel{background:var(--fill)!important;color:var(--bg);border-color:var(--fill)}
.dd.sel b,.dd.sel i{color:var(--bg)}
.bar{flex:1;height:6px;border-radius:2px;background:var(--paper);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}

/* 구역 */
.step{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sh{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.sh .n{font-size:12px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.sh .n+h2{margin-right:auto}
.sh h2{font-size:16px;font-weight:800;margin:0;letter-spacing:-.01em}
.fr{margin:6px 0 0}.fr b{color:var(--accent-ink)}
.src{font-size:13px;color:var(--ink-2)}
.src a{color:var(--accent-ink)}
.more{font-size:13.5px;color:var(--accent-ink);text-decoration:none;font-weight:600;align-self:flex-start}
.more:hover{text-decoration:underline}
.report summary{cursor:pointer;font-size:13px;color:var(--ink-2)}
.report textarea{margin-top:8px;min-height:72px}
.report .row{margin-top:8px}

/* 네컷만화 */
.comic{margin:0;display:flex;flex-direction:column;gap:12px}
.comic figcaption b{font-size:16px;font-weight:800}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cp{position:relative;aspect-ratio:320/300;border:2.5px solid #2B2B33;border-radius:6px;overflow:hidden;background:#F1F5FA;min-width:0;container-type:inline-size}
.cp-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cp-o{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;padding:7px;gap:6px;pointer-events:none}
.cp-cap{background:#FFF4B8;color:#2B2B33;border:2px solid #2B2B33;font-size:clamp(11px,4cqw,13.5px);font-weight:700;line-height:1.35;padding:4px 9px;max-width:88%;box-shadow:2px 2px 0 #2B2B33;display:flex;gap:6px}
.cp-cap b{font-weight:900;color:#E0483E}
.cp-cap.only{padding:2px 8px}
.cp-sign{align-self:center;background:#fff;color:#2B2B33;border:2px solid #2B2B33;border-radius:4px;font-size:clamp(11px,4cqw,13.5px);font-weight:900;padding:3px 10px;box-shadow:2px 2px 0 #E0483E;text-align:center;max-width:92%}
.cp-bs{align-self:stretch;display:flex;justify-content:center;gap:6px;margin-top:2px}
.cp-bs.sd{justify-content:flex-end}
.cp-bs.sd .cp-b{max-width:58%}
.cp-bs.n2{justify-content:space-between}
.cp-b{position:relative;background:#fff;color:#2B2B33;border:2.2px solid #2B2B33;border-radius:2px;padding:6px 11px;font-size:clamp(11.5px,4.4cqw,14px);font-weight:700;line-height:1.38;text-align:center;max-width:62%;overflow-wrap:anywhere}
.cp-bs.n2 .cp-b{max-width:49%}
.cp-b::after{content:"";position:absolute;bottom:-11px;width:14px;height:14px;background:#fff;border-right:2.2px solid #2B2B33;border-bottom:2.2px solid #2B2B33;transform:rotate(45deg) skew(8deg,8deg)}
.cp-b.c::after{left:calc(50% - 7px)}
.cp-b.l::after{left:34%}
.cp-b.r::after{right:34%}
.cp-bs.sd .cp-b.r::after{right:auto;left:calc(50% - 7px)}
.cp-b.think{border-radius:50%/46%;padding:9px 14px}
.cp-b.think::after{width:10px;height:10px;border:2.2px solid #2B2B33;border-radius:50%;transform:none;bottom:-15px;box-shadow:none}
.cp-b.think::before{content:"";position:absolute;bottom:-25px;width:6px;height:6px;border:2px solid #2B2B33;border-radius:50%;background:#fff}
.cp-b.think.c::before{left:calc(50% - 10px)}.cp-b.think.l::before{left:30%}.cp-b.think.r::before{right:30%}
.cp-b.shout{border-radius:4px;background:#FFE24D;box-shadow:3px 3px 0 #2B2B33;font-weight:900}
.cp-b.shout::after{background:#FFE24D}
.cp-n{position:absolute;bottom:5px;font-size:clamp(10px,3.4cqw,12px);font-weight:800;color:#2B2B33;background:rgba(255,255,255,.85);border-radius:4px;padding:0 6px;white-space:nowrap}
.cp-n.c{left:50%;transform:translateX(-50%)}.cp-n.s{left:69%;transform:translateX(-50%)}.cp-n.l{left:16%;transform:translateX(-50%)}.cp-n.r{left:84%;transform:translateX(-50%)}
@media (max-width:760px){.cgrid{grid-template-columns:1fr}}
/* 그림 */
.fig{margin:0;display:flex;flex-direction:column;gap:12px}
.fig+.fig{border-top:1px solid var(--line);padding-top:18px}
.fig figcaption{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.fig figcaption b{font-size:16px;font-weight:800}
.fig figcaption span{font-size:15px;line-height:1.6;color:var(--ink);margin-top:2px}
.fbars{display:flex;flex-direction:column;gap:10px}
.fb-row{display:grid;grid-template-columns:minmax(80px,28%) minmax(0,1fr) var(--vw,88px);gap:12px;align-items:center;font-size:13.5px}
.fb-l{color:var(--ink-2);line-height:1.35}
.fb-t{position:relative;height:22px;background:var(--paper);border-radius:5px}
.fb-b{position:absolute;top:0;bottom:0;background:var(--ink-3);border-radius:5px}
.fb-row.hi .fb-b{background:var(--accent)}
.fb-row.hi .fb-l{color:var(--ink);font-weight:700}
.fb-b.neg{background:var(--bad)}
.fb-zero{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--ink-2)}
.fb-ref{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--warm)}
.fb-v{font-weight:800;font-size:14px;text-align:right;white-space:nowrap}
.fb-v.neg{color:var(--bad)}
.fig-ref{margin:0;font-size:12.5px;color:var(--warm);display:flex;align-items:center;gap:6px}
.fig-ref i{display:inline-block;width:14px;border-top:2px dashed var(--warm)}
.fcmp{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.fcmp-h,.fcmp-r{display:grid;grid-template-columns:minmax(90px,1.1fr) minmax(0,1fr) 24px minmax(0,1fr);gap:8px;align-items:center;padding:10px 14px}
.fcmp-h{background:var(--paper);font-size:12.5px;font-weight:700;color:var(--ink-2)}
.fcmp-h span:last-child{color:var(--accent-ink)}
.fcmp-r{border-top:1px solid var(--line);font-size:14px}
.fcmp-l{color:var(--ink-2);font-size:13px}
.fcmp-a{color:var(--ink-2)}
.fcmp-x{color:var(--ink-3);text-align:center}
.fcmp-b{font-weight:800}
.ftl{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(120px,1fr);overflow-x:auto;position:relative;padding-top:4px}
.ftl li{position:relative;display:flex;flex-direction:column;gap:2px;padding:20px 10px 0 0}
.ftl li::before{content:"";position:absolute;top:4px;left:0;right:0;border-top:2px solid var(--line)}
.ftl li::after{content:"";position:absolute;top:-1px;left:0;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ink-3)}
.ftl li.now::after{background:var(--accent);border-color:var(--accent)}
.ftl-w{font-size:12.5px;font-weight:800;color:var(--ink-2)}
.ftl li.now .ftl-w{color:var(--accent-ink)}
.ftl-l{font-size:13.5px;line-height:1.45}
.fsplit{display:flex;height:28px;border-radius:7px;overflow:hidden;gap:2px}
.fsplit i{display:block;height:100%}
.c0{background:var(--accent)}.c1{background:var(--warm)}.c2{background:var(--ink-3)}.c3{background:color-mix(in srgb,var(--accent) 45%,var(--card))}.c4{background:color-mix(in srgb,var(--warm) 45%,var(--card))}
.fsplit-k{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.fsplit-k li{display:flex;align-items:center;gap:6px}
.fsplit-k i{width:10px;height:10px;border-radius:3px;display:inline-block}
.fsplit-k b{color:var(--ink);font-weight:800}
@media (max-width:560px){.ntiles{grid-template-columns:1fr}.nt:nth-child(odd){border-right:0}.nt{border-bottom:1px solid var(--line)!important}.nt:last-child{border-bottom:0!important}.nt b{font-size:24px}}
@media (max-width:760px){
  .fb-row{grid-template-columns:minmax(0,1fr) var(--vw,80px);gap:4px 10px}
  .fb-l{grid-column:1/-1}
  .fb-t{grid-column:1}
  .fcmp-h{display:none}
  .fcmp-r{grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr);row-gap:2px}
  .fcmp-l{grid-column:1/-1;font-weight:600;color:var(--ink)}
  .ftl{grid-auto-flow:row;grid-auto-columns:auto;padding-left:6px}
  .ftl li{padding:0 0 14px 22px}
  .ftl li::before{top:12px;bottom:-4px;left:5px;right:auto;border-top:0;border-left:2px solid var(--line)}
  .ftl li:last-child::before{display:none}
  .ftl li::after{top:4px;left:0}
}
/* 용어 */
button.term{font:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;border-radius:0;border-bottom:1.5px dotted var(--accent);cursor:pointer;text-align:inherit;font-weight:inherit}
mark.em{color:inherit;font-weight:700;background:linear-gradient(transparent 52%,var(--mark) 52%);padding:0 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
button.term:hover{color:var(--accent-ink)}
#pop{position:absolute;z-index:30;background:var(--card);border:1px solid var(--line-2);border-radius:2px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.12);font-size:14px;display:flex;flex-direction:column;gap:6px}
#pop p{margin:0;color:var(--ink-2)}
#pop a{color:var(--accent-ink);font-size:13px;text-decoration:none;font-weight:600}
.termlist{display:flex;flex-direction:column}
.termlist details{border-top:1px solid var(--line);padding:9px 0}
.termlist details:first-child{border-top:0;padding-top:0}
.termlist summary{cursor:pointer;font-weight:600}
.termlist p{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.glist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:2px;padding:14px 16px}
.gitem:hover{border-color:var(--ink-3)}
.gitem b{font-weight:800}
.gitem span{grid-column:1/-1;font-size:13.5px;color:var(--ink-2)}
.gitem em{font-style:normal;font-size:12px;color:var(--accent-ink);font-weight:600;grid-row:1;grid-column:2}

/* 생각의 틀, 이어보기 */
.frs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.frs a{display:flex;flex-direction:column;gap:2px;text-decoration:none;border:1px solid var(--line);border-radius:2px;padding:11px 14px}
.frs a:hover{border-color:var(--ink-3)}
.frs b{font-weight:700;font-size:14.5px}
.frs span{font-size:13px;color:var(--ink-2)}
a.fcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:2px;padding:18px 20px}
a.fcard:hover{border-color:var(--ink-3)}
.fcard .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.fcard b{font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.fcard p{margin:0;font-size:14px;color:var(--ink-2)}
.fcard ul{margin:0;padding-left:1.15em;font-size:13.5px;color:var(--accent-ink)}
.tl{list-style:none;margin:0;padding:0 0 0 20px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:20px}
.tl li{position:relative;display:flex;flex-direction:column;gap:4px}
.tl li::before{content:"";position:absolute;left:-27px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.tld{font-size:13px;color:var(--ink-2);font-weight:600}
.tl a{font-weight:700;text-decoration:none;font-size:16px}
.tl a:hover{color:var(--accent-ink)}
.tl p{margin:0;font-size:14px;color:var(--ink-2)}

/* 기초 다지기 */
.blist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line-2)}
.bitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.bitem:hover .bt2 b{color:var(--accent-ink)}
.bn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.bt2 b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.bt2 p{margin:2px 0 0;font-size:14px;color:var(--ink-2)}
.bs{font-size:13px;color:var(--ink-2);font-weight:600;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0;padding-top:0}
.steps a{font-weight:700;text-decoration:none;font-size:15.5px;display:block}
.steps a:hover{color:var(--accent-ink)}
.sn{width:28px;height:28px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.sn.done{background:var(--accent);border-color:var(--accent);color:#fff}
@media (max-width:760px){.bitem{grid-template-columns:auto minmax(0,1fr);gap:12px}.bs{grid-column:2}}
/* 마이페이지 */
#account{display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--ink-2)}
#account button{font-size:13.5px;padding:7px 13px}
.authrow{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.authrow b{color:var(--ink);font-weight:700}
.ask{display:flex;flex-direction:column;gap:8px;background:var(--paper);border-radius:2px;padding:12px 14px}
.ask[hidden]{display:none}
.ask p{margin:0;color:var(--ink)}
.notice summary{cursor:pointer;color:var(--ink-2);font-size:13px;font-weight:600}
.notice ul{margin:8px 0 0;padding-left:1.15em;display:flex;flex-direction:column;gap:6px;font-size:13px}
.notice b{color:var(--ink);font-weight:700}
@media (max-width:460px){.br-row{flex-direction:column;gap:4px}.br-k{min-width:0;align-self:flex-start}}
.pre{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pre-c{background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:12px 14px}
.pre-c b{font-size:15.5px;color:var(--ink)}
.pre-c p{margin:4px 0 0;font-size:14.5px;color:var(--ink-2)}
.pre-c a{display:inline-block;margin-top:6px;font-size:13.5px;font-weight:600;color:var(--accent-ink);text-decoration:none}
.look{margin:0;font-size:15px;font-weight:700;color:var(--ink)}
.modepick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modepick button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:2px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit;line-height:1.45}
.modepick button b{font-size:15.5px}
.modepick button span{font-size:12.5px;color:var(--ink-2)}
.modepick button em{font-style:normal;font-size:12.5px;color:var(--ink-2)}
.modepick button.on{border-color:var(--accent);background:var(--accent-bg)}
.modepick button.on b{color:var(--accent-ink)}
@media (max-width:460px){.modepick{grid-template-columns:1fr}}
.goalrow{display:flex;align-items:center;gap:8px;font-size:15px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bdg{display:flex;flex-direction:column;gap:1px;border-radius:2px;padding:11px 13px;border:1px solid var(--accent);background:var(--accent-bg);color:var(--accent-ink)}
.bdg b{font-size:14px;font-weight:800}
.bdg span{font-size:12px}
.bdg.off{border-color:var(--line);background:var(--card);color:var(--ink-3)}
.bdg.off b{font-weight:600;color:var(--ink-2)}
.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.links li{display:flex;flex-direction:column;gap:2px;padding:11px 0;border-top:1px solid var(--line)}
.links li:first-child{border-top:0;padding-top:0}
.links a{text-decoration:none;font-weight:600}
.links a:hover{color:var(--accent-ink)}
.wn{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.sh+.wn{border-top:0;padding-top:0}
.wn p{margin:0;font-size:14.5px}
.wn .mine span,.wn .right span{font-size:12px;margin-right:6px}
.tgh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}
.tgh b{font-weight:700}
.tgh span{color:var(--ink-2);font-size:13px}
.note{border-top:1px solid var(--line);padding:12px 0}
.note:first-of-type{border-top:0;padding-top:0}
.note summary{cursor:pointer;font-size:14.5px;line-height:1.5;font-weight:600}
.note .ans{margin:0 0 8px;background:var(--paper);border-radius:2px;padding:10px 12px;font-size:14.5px;white-space:pre-wrap;font-weight:400}
.rvt{font-size:18px;font-weight:800;text-decoration:none;letter-spacing:-.01em}
.rvt:hover{color:var(--accent-ink)}
.today{border-color:var(--accent)}
.tdn{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tdn b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.ctab{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:2px;background:var(--fill);color:var(--bg);font-weight:700;font-size:15px;text-decoration:none;line-height:1.4}
.ctab:hover{opacity:.9}
.ctab span{min-width:0;overflow-wrap:anywhere}
.ctab i{font-style:normal}
.alldone{margin:0;padding:12px 16px;border:1px solid var(--warm);border-radius:2px;background:transparent;color:var(--warm);font-weight:600;font-size:14.5px}
.pg{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
.pgl{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.pgl b{font-weight:700}.pgl em{font-style:normal;color:var(--ink-2);font-size:13px}
.pg:hover .pgl b{color:var(--accent-ink)}
.wk1{margin:0;font-size:16px;font-weight:700}
.wkr{display:flex;flex-direction:column;gap:6px}
.wkr+.wkr{border-top:1px solid var(--line);padding-top:12px}
.wkr .bar{flex:none}
.bchips{display:flex;flex-wrap:wrap;gap:6px}
.bchip{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:2px;border:1px solid var(--accent);color:var(--accent-ink);background:transparent}
.nbd{display:flex;flex-direction:column;gap:6px}
.nbd .bar{flex:none}
.setcol{display:flex;flex-direction:column;gap:20px;max-width:720px}
.nbox{display:flex;flex-direction:column;gap:12px}
.nbox .chips{margin:0}
.rt{display:flex;flex-direction:column;gap:8px}
.rt .row{flex-wrap:wrap}
.mepane{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.mepane>div{display:flex;flex-direction:column;gap:20px;min-width:0}

/* 달력 */
.cal{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead b{font-size:17px;font-weight:800}
.calhead button{padding:3px 12px;font-size:16px;text-align:center}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.wk{font-size:12px;color:var(--ink-2);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper);font-weight:600}
.cd{position:relative;height:clamp(46px,8vw,64px);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:5px 7px;text-decoration:none;color:var(--ink);line-height:1.2;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cd.blank{background:var(--paper)}
.cd b{font-weight:700;font-size:12.5px}
.cd i{font-style:normal;font-size:11.5px;font-weight:700;align-self:flex-end}
.cd u{position:absolute;top:8px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--warm)}
.lv0{background:var(--card)}
.lv1{background:color-mix(in srgb,var(--accent) 16%,var(--card))}
.lv2{background:color-mix(in srgb,var(--accent) 34%,var(--card))}
.lv3{background:color-mix(in srgb,var(--accent) 58%,var(--card))}
.lv4{background:var(--accent)}
.cd.lv3,.cd.lv4{color:#fff}
.cd.today b{background:var(--fill);color:var(--bg);border-radius:2px;padding:0 6px}
.cd.sel{box-shadow:inset 0 0 0 2px var(--ink)}
a.cd:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.cd.met::before{content:"✓";position:absolute;bottom:4px;left:7px;font-size:11px;font-weight:800}
.calfoot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--ink-2)}
.calfoot b{color:var(--ink);font-weight:700}
.legend{display:flex;align-items:center;gap:3px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line)}

.page.read .wrap{max-width:820px}
.page.read.wide .wrap{max-width:1180px}
/* 넓은 화면 */
@media (min-width:1100px){h1{font-size:30px}}
/* 좁은 화면 */
@media (max-width:860px){
  .mepane{grid-template-columns:1fr}
}
@media (max-width:760px){
  .tin,.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .wrap{padding-top:22px}
  h1{font-size:23px}
  .glist{grid-template-columns:1fr}
  .step,.cal{padding:16px}

}
@media (prefers-reduced-motion:no-preference){.reveal,.fb{animation:in .2s ease-out}@keyframes in{from{transform:translateY(3px)}to{transform:none}}}

/* 경험치 */
.xpt-box{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.xpt{background:#2B2B33;color:#fff;font-size:14px;padding:7px 14px;border-radius:2px;box-shadow:0 6px 18px rgba(0,0,0,.18);animation:xpt 2.2s ease forwards;white-space:nowrap}
.xpt b{color:#FFC94A;font-size:15px}
@keyframes xpt{0%{opacity:0;transform:translateY(12px) scale(.9)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
/* 안내 상자 */
.mnote{background:var(--paper);border-radius:2px;padding:12px 14px}
.mnote p{margin:0;font-size:15px}
.mnote .chip{display:inline-block;margin-top:6px}
.cele-ic{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:var(--accent);display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1) .1s both}
.cele-ic svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
/* (이전 마스코트) */
.mbox{display:flex;align-items:flex-end;gap:10px}
.mfig{flex:none;width:68px;height:78px}
.mfig svg,.cele-fig svg{width:100%;height:100%;overflow:visible}
.mbub{position:relative;flex:1;min-width:0;background:var(--card);border:1.5px solid var(--line);border-radius:2px;padding:10px 14px;margin-bottom:14px}
.mbub::before{content:"";position:absolute;left:-8px;bottom:14px;width:14px;height:14px;background:var(--card);border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg)}
.mbub .mname{display:block;font-size:11.5px;font-weight:800;color:#C77800;margin-bottom:2px}
.mbub p{margin:0;font-size:15px}
.mbub .chip{display:inline-block;margin-top:6px}
/* 축하 화면 */
.cele{position:fixed;inset:0;z-index:80;background:rgba(15,18,17,.55);display:grid;place-items:center;padding:16px;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}}
.cele-card{position:relative;width:min(380px,100%);background:var(--card);border-radius:2px;padding:22px 20px 18px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.cele-fig{width:130px;height:150px;margin:-70px auto 4px;animation:hop 1s ease .3s 2}
@keyframes hop{0%,100%{transform:none}40%{transform:translateY(-14px)}}
.cele h2{margin:0;font-size:24px}
.cele-say{margin:6px 0 10px;color:var(--ink-2);font-size:15px}

.cele-xp span{font-size:15px;font-weight:700;margin-left:4px}
.cele-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px}

.cele-stats b{font-size:18px}.cele-stats span{font-size:11.5px;color:var(--ink-2)}
.cele-btns{display:flex;flex-direction:column;gap:8px}
.cele-btns a,.cele-btns button{text-align:center;text-decoration:none;padding:12px;border-radius:2px;font-weight:700;font-size:15px}
.cele-btns a.pri{background:var(--accent);color:#fff;border:0}
.conf{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.conf i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
/* 순서·짝 맞추기 */
.ord{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.ord-msg{margin:12px 0 10px;font-size:14px;color:var(--ink-2);background:var(--accent-bg);border-radius:2px;padding:9px 12px}
.ord-msg b{color:var(--accent-ink)}
.ord button,.mt-d button{font-size:14.5px;border-radius:2px;border-width:1.5px;border-bottom-width:3px}
.mt-t{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.mt-t button{font-weight:700;border-radius:2px;border-width:1.5px;border-bottom-width:3px;padding:7px 14px}
.mt-d{display:flex;flex-direction:column;gap:6px}
.mt-d button{font-size:13.5px;color:var(--ink-2)}
.mt-t button.sel{border-color:var(--accent);background:var(--accent-bg);color:var(--ink)}
button.ok-m{border-color:var(--good)!important;background:var(--accent-bg)!important;color:var(--ink)!important;opacity:.75}
.shake{animation:shake .35s;border-color:var(--bad)!important}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
button.lnk{border:0;background:none;padding:0;color:var(--accent);font-weight:700;font-size:inherit}
/* 친구 리그 */
.lg{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.lg li{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:2px}
.lg li.me{background:var(--accent-bg)}

.lg .rk.t1{background:#FFD54A;color:#5A4300}.lg .rk.t2{background:#D5DAE1;color:#3B4250}.lg .rk.t3{background:#EDC39A;color:#5A3510}
.lg b{flex:1;min-width:0}.lg em{font-style:normal;font-weight:700;color:#C77800;font-size:14px}
.lg-me b{font-size:40px;font-weight:900;color:#E89A00}.lg-me span{margin-left:4px;font-weight:700}
.wkbars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:110px;align-items:end}
.wkbars div{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.wkbars i{display:block;width:70%;max-width:28px;min-height:3px;background:#FFD27A;border-radius:6px 6px 2px 2px}
.wkbars .on i{background:#FFB82E}

.wkbars span{font-size:12px;color:var(--ink-2)}.wkbars .on span{font-weight:800;color:var(--ink)}
/* 기초 다지기 길 */
.bwrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;align-items:start}

.bmain{display:flex;flex-direction:column;gap:14px;min-width:0}
.bidx{list-style:none;margin:0;padding:6px;border:1px solid var(--line);border-radius:2px;background:var(--card);display:flex;flex-direction:column}
.bidx a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:2px;text-decoration:none;color:var(--ink);font-size:14px}
.bidx a:hover{background:var(--paper)}
.bidx i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--u)}
.bidx span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bidx em{font-style:normal;font-size:12px;color:var(--ink-3)}

@media (max-width:900px){.bwrap{grid-template-columns:1fr}.bside{position:static}.bidx{display:none}}
.bsum{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:14px 16px}
.bsum .mbub{border:0;background:var(--paper);margin-bottom:6px}.bsum .mbub::before{background:var(--paper);border:0}
.bsum-bar{height:10px;border-radius:2px;background:var(--card);margin-top:10px;overflow:hidden}

.bsum .bsum-bar{background:var(--paper)}
.bsum-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.bgo{background:var(--accent);color:#fff;font-weight:800;font-size:14px;text-decoration:none;padding:8px 16px;border-radius:2px;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.bunit{display:flex;flex-direction:column;gap:6px}
.bu{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:2px;text-decoration:none;color:var(--ink);background:color-mix(in srgb,var(--u) 12%,var(--card));border:1.5px solid color-mix(in srgb,var(--u) 30%,var(--card))}
.bu-n{flex:none;width:34px;height:34px;border-radius:2px;display:grid;place-items:center;background:var(--u);color:#fff;font-weight:900;font-size:15px}
.bu-t{flex:1;min-width:0;display:flex;flex-direction:column}
.bu-t b{font-size:16px}
.bu-t span{font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.bu-p{flex:none;font-size:13px;font-weight:800;color:color-mix(in srgb,var(--u) 80%,var(--ink))}
.bu.wait{background:var(--card);border:1.5px solid var(--line);padding:12px 14px}
.bu.wait .bu-n{background:color-mix(in srgb,var(--u) 18%,var(--card));color:var(--u);width:30px;height:30px;font-size:13px;border-radius:2px}
.bu.wait b{font-size:15px;color:var(--ink)}
.bpath{display:flex;flex-direction:column;align-items:center;gap:18px;padding:16px 0 12px}
.bstep{position:relative;display:flex;flex-direction:column;align-items:center;width:170px;transform:translateX(calc(var(--o)*64px))}
.bn{width:64px;height:58px;border-radius:50%;display:grid;place-items:center;border:0;padding:0;cursor:pointer;background:var(--u);box-shadow:0 6px 0 color-mix(in srgb,var(--u) 62%,#000);transition:transform .08s}
.bn:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--u) 62%,#000)}
.bn svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.bn svg .f{fill:#fff;stroke:none}
.bn.done{background:#FFC83D;box-shadow:0 6px 0 #D99A00}
.bn.cur{width:74px;height:68px;outline:7px solid color-mix(in srgb,var(--u) 22%,transparent);outline-offset:3px}
.bn.lock{background:var(--line);box-shadow:0 6px 0 color-mix(in srgb,var(--line) 70%,#000)}
.bn.lock svg{stroke:var(--ink-3)}
.bstart{position:relative;margin-bottom:12px;background:var(--card);color:var(--u);border:2px solid var(--line);font-weight:900;font-size:13px;padding:5px 12px;border-radius:2px;animation:bob 1.6s ease-in-out infinite}
.bstart::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-4px)}}
.bl{margin-top:12px;font-size:13px;font-weight:600;text-align:center;line-height:1.35;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bstep.cur .bl{color:var(--ink);font-weight:800}
.bl.off{color:var(--ink-3);font-weight:500}
@media (max-width:560px){.bstep{transform:translateX(calc(var(--o)*44px))}}
@media (prefers-reduced-motion:reduce){.bstart,.cele-fig,.conf i,.xpt,.cele-card{animation:none}}

/* 기초 다지기 단계 */
.stp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.st{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding-bottom:16px}
.st::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.st:last-child::before{display:none}
.st.done::before{background:var(--u)}
.st-m{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:16px;background:var(--card);border:2px solid var(--line);color:var(--ink-3)}
.st-m svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.st.done .st-m{background:var(--u);border-color:var(--u)}
.st.cur .st-m{background:var(--u);border-color:var(--u);color:#fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--u) 20%,transparent)}
.st.lock .st-m{color:var(--u);border-color:color-mix(in srgb,var(--u) 45%,var(--line))}
.st-c{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:14px 16px;min-width:0}
.st.cur .st-c{border:2px solid var(--u);box-shadow:0 6px 20px color-mix(in srgb,var(--u) 14%,transparent)}
.st.wait .st-c{background:transparent;border-style:dashed}
.st-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;text-decoration:none;color:var(--ink)}
.st-k{font-size:12px;font-weight:800;color:var(--u)}
.st-h b{font-size:16.5px}
.st-b{margin-left:auto;font-size:12px;font-weight:700;padding:2px 9px;border-radius:2px;background:var(--paper);color:var(--ink-2)}
.st.cur .st-b{background:var(--u);color:#fff}
.st.done .st-b{background:color-mix(in srgb,var(--u) 15%,var(--card));color:var(--u)}
.st-p{margin:6px 0 0;font-size:13.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st.wait .st-h b{color:var(--ink-2)}
.ss{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.ss li{position:relative}
.ss li:not(:last-child)::after{content:"";position:absolute;left:13px;top:34px;height:calc(100% - 26px);width:2px;background:var(--line)}
.ss li.done:not(:last-child)::after{background:var(--u)}
.ss a,.ss button{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px 6px 0;border:0;background:none;border-radius:2px;text-decoration:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.ss a:hover .ss-t{text-decoration:underline}
.ss-d{position:relative;z-index:1;flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:800;background:var(--paper);color:var(--ink-2)}
.ss-d svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ss li.done .ss-d{background:var(--u);color:#fff}
.ss li.cur .ss-d{background:var(--u);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--u) 22%,transparent)}
.ss li.lock .ss-d{color:var(--ink-3)}
.ss-t{flex:1;min-width:0;font-size:14px;line-height:1.4}
.ss li.cur .ss-t{font-weight:800}
.ss li.lock .ss-t{color:var(--ink-3)}
.ss-go{flex:none;font-size:12.5px;font-weight:800;color:#fff;background:var(--u);padding:5px 11px;border-radius:2px}
@media (max-width:560px){.st{grid-template-columns:34px minmax(0,1fr);gap:10px}.st-m{width:34px;height:34px;font-size:14px}.st::before{left:16px;top:34px}.ss-go{display:none}}

/* 회사별 보기 */
.cochips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cochips a{font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:2px;background:var(--accent-bg);color:var(--accent-ink);text-decoration:none}
.cochips a:hover{text-decoration:underline}
.cosec h2{font-size:16px;margin:18px 0 10px}
.cogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cocard{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:1px;align-items:center;padding:16px 16px 14px;border:1px solid var(--line);border-radius:2px;background:linear-gradient(135deg,color-mix(in srgb,var(--cc) 9%,var(--card)),var(--card) 60%);text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s,box-shadow .15s}
.cocard::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--cc)}
.cocard:hover{border-color:var(--cc);transform:translateY(-2px);box-shadow:0 8px 20px color-mix(in srgb,var(--cc) 18%,transparent)}
.cocard .comono{grid-row:1/4;grid-column:1}
.cocard>b,.cocard>span:not(.comono),.cocard>em{grid-column:2}
.comono{flex:none;width:44px;height:44px;border-radius:2px;display:grid;place-items:center;background:var(--cc);color:var(--ci);font-weight:900;font-size:13px;letter-spacing:-.03em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.comono{position:relative;overflow:hidden}
.comono img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:7px;background:#fff;opacity:0;transition:opacity .2s}
.comono.haslogo{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--cc) 35%,#fff)}
.comono.haslogo img{opacity:1}
.comono.small img{padding:9px;image-rendering:auto}
.comono.big{width:64px;height:64px;border-radius:2px;font-size:18px}
.cohead{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:2px;background:color-mix(in srgb,var(--cc) 10%,var(--card));border:1px solid color-mix(in srgb,var(--cc) 28%,var(--line));margin-top:4px}
.cohead h1{margin:4px 0 0}
.cohead .tag{background:var(--card);color:var(--ink-2)}
.codot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cc);margin-right:6px;vertical-align:1px}
.cocard b{font-size:16px}
.cocard>span:not(.comono){font-size:12.5px;color:var(--ink-2)}
.cocard em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--accent-ink);margin-top:6px}
.cocard.off{background:var(--card)}
.cocard.off .comono{opacity:.55}
.cocard.off::before{opacity:.45}
.cocard.off em{color:var(--ink-3);font-weight:500}
.cotl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:14px}
.cotl li{position:relative;display:flex;flex-direction:column;gap:2px}
.cotl li::before{content:"";position:absolute;left:-25px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.cotl li.done::before{background:var(--accent)}
.cotl-d{font-size:12px;font-weight:700;color:var(--ink-3)}
.cotl a{font-weight:700;color:var(--ink);text-decoration:none}
.cotl a:hover{text-decoration:underline}
.coq{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.coq:first-of-type{border-top:0}

/* 회사 소식 */
.nwl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.nwl li{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.nwl li:first-child{border-top:0;padding-top:4px}
.nw-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nw-d{font-size:12px;font-weight:700;color:var(--ink-3)}
.nw-k{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:2px;background:var(--paper);color:var(--ink-2)}
.nw-c{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:2px;background:var(--accent-bg);color:var(--accent-ink);text-decoration:none}
.nw-t{font-size:15.5px}
.nw-x{margin:0;font-size:14px;color:var(--ink-2)}
.nw-p{margin:2px 0 0;font-size:13.5px;background:var(--accent-bg);border-radius:2px;padding:7px 10px}
.nw-p span{font-weight:800;color:var(--accent-ink);margin-right:6px}
.nw-f{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px}
.nw-f a{color:var(--accent-ink);text-decoration:none;font-weight:600}
.nw-f a:hover{text-decoration:underline}

/* 회사 기본 정보 */
.pf{border-top:3px solid var(--cc)}
.pf-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:-4px 0 14px}
.pf-tabs button{border:0;background:none;border-radius:0;padding:8px 12px;font-size:14px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.pf-tabs button.on{color:var(--ink);border-bottom-color:var(--cc);font-weight:800}
.pf-sum{margin:0 0 12px;font-size:16px;font-weight:600}
.pf-facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin:0 0 6px}
.pf-facts div{background:var(--paper);border-radius:2px;padding:10px 12px}
.pf-facts dt{font-size:12px;font-weight:700;color:var(--ink-3)}

.pf-h{font-size:14.5px;margin:14px 0 6px}
.pf-rn{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:4px;font-size:13.5px}

.pf-tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.pf-src{margin-top:12px}.pf-src ul{margin:6px 0 0;padding-left:18px}.pf-src a{color:var(--accent-ink)}
.pf-empty{border-style:dashed}

/* 회사 페이지 머리와 기본 정보 (다듬은 판) */
.cohero{position:relative;overflow:hidden;border-radius:2px;padding:24px 24px 20px;color:var(--ci);background:linear-gradient(135deg,var(--cc),color-mix(in srgb,var(--cc) 62%,#000));margin-top:6px;box-shadow:0 14px 36px color-mix(in srgb,var(--cc) 28%,transparent)}
.cohero::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.cohero::before{content:"";position:absolute;right:60px;bottom:-110px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06)}
.cohero-top{position:relative;z-index:1;display:flex;align-items:center;gap:16px}
.cohero .comono.big{width:68px;height:68px;border-radius:2px;background:#fff;color:color-mix(in srgb,var(--cc) 72%,#000);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.cohero-tags{display:flex;gap:6px;flex-wrap:wrap}
.cohero-tags span{font-size:12px;font-weight:700;padding:3px 10px;border-radius:2px;background:color-mix(in srgb,var(--ci) 16%,transparent);color:var(--ci)}
.cohero h1{margin:6px 0 0;color:var(--ci);font-size:32px;letter-spacing:-.02em}
.cohero-sum{position:relative;z-index:1;margin:16px 0 0;font-size:16px;line-height:1.6;color:var(--ci);opacity:.95;max-width:720px}
.cohero-sum mark.em{background:none;color:inherit;font-weight:800;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--ci) 55%,transparent);text-underline-offset:4px}
.cohero-kpi{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:18px}
.cohero-kpi div{background:color-mix(in srgb,var(--ci) 13%,transparent);border-radius:2px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;backdrop-filter:blur(2px)}
.cohero-kpi span{font-size:12px;color:var(--ci);opacity:.8}
.cohero-kpi b{font-size:18px;color:var(--ci)}
.pf{border-top:0;padding-top:20px}
.pf-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.pf-head h2{margin:0;font-size:18px}
.pf-head span{font-size:12px;color:var(--ink-3)}
.pf-tabs{display:flex;gap:4px;padding:4px;border-radius:2px;background:var(--paper);border:0;margin:0 0 18px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.pf-tabs::-webkit-scrollbar{display:none}
.pf-tabs button{flex:none;border:0;border-radius:2px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink-2);background:none;margin:0}

.pf-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 24px;margin:0}
.pf-facts div{background:none;border-radius:0;padding:11px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:baseline}
.pf-facts dt{font-size:13px;font-weight:700;color:var(--ink-3)}
.pf-facts dd{margin:0;font-size:14.5px;font-weight:600}
.pf-h{font-size:15px;margin:22px 0 10px}
.pf-str{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.pf-str li{counter-increment:s;position:relative;padding:14px 16px 14px 52px;border-radius:2px;background:color-mix(in srgb,var(--cc) 6%,var(--card));border:1px solid color-mix(in srgb,var(--cc) 18%,var(--line));font-size:14.5px;line-height:1.6}
.pf-str li::before{content:counter(s);position:absolute;left:14px;top:13px;width:26px;height:26px;border-radius:2px;display:grid;place-items:center;background:var(--cc);color:var(--ci);font-weight:900;font-size:13px}
@media (max-width:560px){.cohero{padding:20px 18px 16px}.cohero h1{font-size:26px}.cohero .comono.big{width:56px;height:56px}.pf-facts div{grid-template-columns:64px 1fr}}

/* 주력 상품·인재상 (다듬은 판) */

.tl{position:relative;overflow:hidden;padding:18px 18px 16px;border-radius:2px;background:linear-gradient(160deg,color-mix(in srgb,var(--cc) 14%,var(--card)),var(--card) 70%);border:1px solid color-mix(in srgb,var(--cc) 22%,var(--line))}

.pf-cul p{margin:0;font-size:14px;line-height:1.6;align-self:center}

/* 지원 회사 고정 */
.cowrap{position:relative}
.cowrap .cocard{height:100%}
.favb{position:absolute;top:12px;right:10px;width:34px;height:34px;padding:0;border-radius:2px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-3);cursor:pointer}
.favb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}

.favb.on{color:#E8A400}.favb.on svg{fill:#FFC83D;stroke:#E8A400}
.favb.big{position:relative;top:auto;right:auto;width:auto;height:auto;margin-left:auto;align-self:flex-start;display:flex;gap:6px;align-items:center;padding:7px 12px;border-radius:2px;background:color-mix(in srgb,var(--ci) 16%,transparent);color:var(--ci);font-size:13px;font-weight:700;z-index:1}

.favb.big.on{background:#fff;color:#8A6200}
.favtip{display:flex;align-items:center;gap:6px}.favtip svg{width:16px;height:16px;fill:#FFC83D;stroke:#E8A400;stroke-width:1.5;flex:none}
.favhint{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:2px;border:1.5px dashed var(--line);text-decoration:none;color:var(--ink-2);font-size:14px}
.favhint svg{width:22px;height:22px;flex:none;fill:#FFE7A0;stroke:#E8A400;stroke-width:1.5}

.mk-c .comono{width:30px;height:30px;border-radius:2px;font-size:10px;flex:none}
.mk-c b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-c.on{border-color:var(--cc,var(--accent));background:color-mix(in srgb,var(--cc,var(--accent)) 10%,var(--card));box-shadow:0 0 0 1.5px var(--cc,var(--accent))}
.mk-c.on b{font-weight:800}

/* ===== 개편 1차: 공통 틀 · 첫 화면 · 이슈 상세 ===== */
/* 공통 요소 */
.page{min-height:100vh}
.tag{font-size:13px;font-weight:700;color:var(--slate);align-self:flex-start;letter-spacing:-.005em}
.tag.light{color:var(--slate)}
.jobs{display:flex;flex-wrap:wrap}
.jobs span{font-size:12.5px;color:var(--ink-3);font-weight:500}
.jobs span:not(:last-child)::after{content:"\00a0·\00a0"}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .small{margin-right:6px;font-weight:600}
.chips button{font-size:13px;padding:5px 12px;border-radius:2px}
.chips button.on{background:var(--fill);border-color:var(--fill);color:var(--on-fill);font-weight:600}
.q{margin:0;font-size:16px;font-weight:500}
.reveal{background:var(--paper);padding:13px 16px;font-size:14.5px;color:var(--ink-2);white-space:pre-wrap;margin-top:10px}
.reveal strong{color:var(--ink)}
.reveal .ok{color:var(--accent-ink)}
.reveal .no{color:var(--bad)}
.fb{white-space:pre-wrap;background:var(--paper);padding:13px 16px;font-size:14.5px;color:var(--ink);margin-top:10px}
.fb strong{color:var(--accent-ink)}
.gauge{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gauge div{background:var(--paper);padding:10px 12px}
.gauge span{display:block;font-size:12.5px;color:var(--ink-2)}
.gauge em{font-style:normal;font-size:22px;font-weight:700;font-family:var(--f-disp)}
.points{margin:0;padding:0;list-style:none;counter-reset:p;display:flex;flex-direction:column;gap:6px;font-size:15px}
.points li{counter-increment:p;display:grid;grid-template-columns:28px minmax(0,1fr)}
.points li::before{content:counter(p);font-family:var(--f-disp);font-weight:800;color:var(--accent-ink)}
.next{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.next a{color:var(--ink);font-size:14px;font-weight:600;text-decoration:none}
.next a:hover{color:var(--accent-ink)}
.cnt{font-size:10.5px;font-weight:700;background:#F3F3EC;color:#552518;border-radius:2px;padding:0 5px;line-height:1.6;min-width:16px;text-align:center}
.me .dot,.who .dot{display:inline-block;width:7px;height:7px;background:#F3F3EC;margin-left:6px;vertical-align:1px}

/* 위쪽 갈색 띠 */
.top{background:var(--top);color:var(--on-top)}
.top .in{max-width:1180px;margin:0 auto;padding:0 max(28px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:36px;height:64px}
.logo{font-family:var(--f-disp);font-weight:800;font-size:21px;letter-spacing:-.03em;display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;flex:none;white-space:nowrap}
.logo i{display:inline-block;width:22px;height:22px;border:2.5px solid #F3F3EC;border-radius:3px;position:relative;flex:none}
.logo i::after{content:"";position:absolute;left:3px;right:3px;top:6px;height:2.5px;background:#F3F3EC;box-shadow:0 5px 0 #F3F3EC}
.gnav{display:flex;gap:26px;align-self:stretch}
.gnav a{position:relative;display:flex;align-items:center;gap:6px;color:inherit;text-decoration:none;font-size:15px;font-weight:600;opacity:.75;white-space:nowrap}
.gnav a:hover{opacity:1}
.gnav a.on{opacity:1;color:#fff;box-shadow:inset 0 -3px 0 #F3F3EC}
.top .me{margin-left:auto;font-size:14px;opacity:.85;color:inherit;text-decoration:none;white-space:nowrap;padding:8px 0}
.top .me:hover,.top .me.on{opacity:1}
.top .me.on{text-decoration:underline;text-underline-offset:6px}
/* 세부 탭 줄 */
.topbar{border-bottom:1px solid var(--line);background:var(--bg)}
.topbar.single{display:none}
.tin,.wrap{max-width:1180px;margin:0 auto;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.tabs{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;font-size:14.5px;color:var(--ink-2);text-decoration:none;padding:12px 2px 11px;border-bottom:2px solid transparent;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--ink);border-color:var(--ink);font-weight:700}
/* 휴대폰 아래 탭 막대 */
.side{display:none}
#vprog{display:none}

/* 첫 화면 */
.hm{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:start}
.hbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.hdate{font-family:var(--f-disp);font-size:44px;font-weight:800;letter-spacing:-.05em;line-height:1;margin:0;text-wrap:nowrap}
.hdate em{font-style:normal;color:var(--ink-3);font-weight:700;font-size:22px;margin-left:8px;letter-spacing:-.02em}
.harr{display:flex;gap:4px;align-items:center}
.harr a,.harr button{width:36px;height:36px;display:grid;place-items:center;border:1.5px solid var(--ink);color:var(--ink);font-weight:800;border-radius:2px;text-decoration:none;font-size:18px;padding:0;background:var(--bg);line-height:1}
.harr a.off{border-color:var(--line);color:var(--ink-3);pointer-events:none}
.harr button.cal{width:auto;padding:0 12px;font-size:13px;font-weight:700}
.harr button[aria-expanded="true"]{background:var(--ink);color:var(--bg)}
.hback{font-size:13px;font-weight:700;color:var(--accent-ink);text-decoration:none;margin-left:6px}
.hback:hover{text-decoration:underline}
.hgoal{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;color:var(--ink-2)}
.hgoal .meter{width:160px;height:10px;display:grid;gap:3px}
.hgoal .meter i{background:var(--line)}
.hgoal .meter i.y{background:var(--fill)}
.hgoal b{color:var(--ink);font-family:var(--f-disp);font-weight:800}
.dcal{margin:0 0 18px;background:var(--card);border:1px solid var(--line);padding:12px 12px 14px;max-width:460px}
.dcal[hidden]{display:none}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.hsum{font-size:14.5px;color:var(--ink-2);font-weight:600}
.areaf{position:relative}
.areab{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:500;padding:6px 12px;border:1px solid var(--ink);border-radius:2px;background:var(--bg);color:var(--ink);white-space:nowrap}
.areab:hover{border-color:var(--ink)}
.areab .caret{font-size:11px}
.areab[aria-expanded="true"] .caret{transform:rotate(180deg)}
.areab.on{background:var(--ink);color:var(--bg);font-weight:700}
.aream{position:absolute;right:0;top:calc(100% + 4px);z-index:30;min-width:200px;max-height:70vh;overflow-y:auto;background:var(--bg);border:1px solid var(--ink);border-radius:2px;display:flex;flex-direction:column}
.aream[hidden]{display:none}
.aream button{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;border-radius:0;padding:9px 14px;background:var(--bg);color:var(--ink);font-size:14px;font-weight:500;text-align:left}
.aream button:hover,.aream button:focus-visible{background:var(--paper);border:0}
.aream button.on{font-weight:800;background:var(--paper)}
.aream button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.irow{display:grid;grid-template-columns:64px minmax(0,1fr) 150px;gap:20px;padding:26px 0;border-bottom:1px solid var(--line);align-items:start}
.ino{font-family:var(--f-disp);font-size:34px;font-weight:300;color:var(--accent-ink);line-height:1;letter-spacing:-.04em}
.icat{font-size:13px;font-weight:700;color:var(--slate);margin-bottom:8px;display:flex;gap:10px;flex-wrap:wrap}
.icat .jobs{display:inline-flex}
.icat .jobs span{font-weight:500}
.irow h2{margin:0;font-family:var(--f-disp);font-size:21px;line-height:1.45;font-weight:700;letter-spacing:-.025em}
.irow h2 a{text-decoration:none}
.irow h2 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--accent)}
.ione{margin:10px 0 0;font-size:14.5px;line-height:1.65;color:var(--ink-2)}
.ione b{font-size:12.5px;font-weight:800;color:var(--accent-ink);margin-right:8px}
.igo{display:flex;flex-direction:column;gap:6px;padding-top:2px}
.igo a{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;padding:9px 12px;border:1px solid var(--ink);border-radius:2px;text-decoration:none;color:var(--ink);white-space:nowrap}
.igo a:hover{background:var(--paper)}
.igo a.p{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.igo a.p:hover{opacity:.9}
.igo a::after{content:"→";font-weight:500}
.irow.done .ino{color:var(--ink-3)}
.irow.done h2{color:var(--ink-2)}
.stamp{display:inline-block;margin-left:8px;font-size:11.5px;font-weight:800;color:var(--accent-ink);border:1.5px solid var(--accent-ink);padding:0 6px;border-radius:2px;transform:rotate(-3deg);vertical-align:3px;font-family:var(--f-body)}
.ing{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;color:var(--ink-3);vertical-align:2px;font-family:var(--f-body)}
.hnote{font-size:12.5px;color:var(--ink-3);line-height:1.6;margin:20px 0 0}
.haside{display:flex;flex-direction:column;gap:22px;min-width:0}
.hrec{background:var(--paper);padding:20px 20px 18px}
.hrec h3,.hbox h3{margin:0 0 14px;font-size:13px;font-weight:700;color:var(--ink-2)}
.hbig{display:flex;gap:18px}
.hbig div{flex:1}
.hbig b{display:block;font-family:var(--f-disp);font-size:44px;font-weight:800;letter-spacing:-.05em;line-height:1}
.hbig b small{font-size:18px;font-weight:600;color:var(--ink-2);letter-spacing:0;margin-left:2px}
.hbig span{font-size:12.5px;color:var(--ink-2)}
.hweek{display:flex;gap:5px;margin-top:18px}
.hweek i{flex:1;height:26px;background:var(--card);display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--ink-3)}
.hweek i.y{background:var(--fill);color:var(--on-fill)}
.hbox{background:var(--card);border:1px solid var(--line);padding:20px}
.hbox a{display:block;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;font-weight:600;line-height:1.5;text-decoration:none}
.hbox a:hover{color:var(--accent-ink)}
.hbox a span{display:block;font-size:12.5px;color:var(--ink-3);font-weight:500}
.hbox h3+a{border-top:0;padding-top:0}
.haside .favbox{background:var(--card);border:1px solid var(--line);padding:20px;gap:12px}
.haside .favgrid{grid-template-columns:1fr}

/* 이슈 상세 */
.iss{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:56px;align-items:start}
.imain{min-width:0;max-width:760px;display:flex;flex-direction:column;gap:0}
.imain .back{font-weight:600}
.vcat{margin-top:18px;font-size:13.5px;font-weight:700;color:var(--slate);display:flex;gap:10px;flex-wrap:wrap}
.vcat .jobs span{font-weight:500}
.imain h1{margin:8px 0 0;font-family:var(--f-disp);font-size:32px;line-height:1.38;font-weight:800;letter-spacing:-.035em}
.vmeta{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:20px;padding-bottom:16px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.vcos{font-size:13.5px;color:var(--ink-2)}
.vcos a{font-weight:700;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink-3)}
.vcos a:hover{color:var(--accent-ink);border-color:var(--accent)}
.vmode{display:flex;font-size:13.5px;border:1px solid var(--ink);border-radius:2px;overflow:hidden}
.vmode a{padding:6px 14px;border-left:1px solid var(--ink);text-decoration:none;color:var(--ink);white-space:nowrap}
.vmode a:first-child{border-left:0}
.vmode a.on{background:var(--ink);color:var(--bg);font-weight:700}
.vst{margin-top:52px}
.vsh{display:flex;align-items:baseline;gap:14px;padding-bottom:12px;border-bottom:1px solid var(--ink)}
.vsh b{font-family:var(--f-disp);font-size:40px;font-weight:300;color:var(--accent-ink);line-height:1;letter-spacing:-.04em}
.vsh h2{margin:0;font-family:var(--f-disp);font-size:22px;font-weight:800;letter-spacing:-.03em}
.vsh span{margin-left:auto;font-size:13px;color:var(--ink-3);font-weight:600;text-align:right}
.vit{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:26px 0;border-bottom:1px solid var(--line);scroll-margin-top:16px}
.vit>.vn{font-family:var(--f-disp);font-size:14px;font-weight:700;color:var(--ink-3);padding-top:2px}
.vit>.vb{min-width:0;display:flex;flex-direction:column;gap:12px}
.vit h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.02em}
.vit .q{font-size:16.5px;font-weight:600}
.vit .reveal{margin-top:0}
.vit .reveal::before{content:"해설";display:block;font-size:12.5px;font-weight:800;color:var(--accent-ink);margin-bottom:2px}
.vit .reveal.nolab::before{display:none}
.vit .lead{font-size:14px;color:var(--ink-2);margin:-6px 0 6px}
.vit textarea{border-radius:2px}
/* 선택지 */
.opts{display:flex;flex-direction:column;gap:6px}
.opts.h{flex-direction:row;flex-wrap:wrap}
button.opt{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:2px;font-size:15px;line-height:1.5;background:var(--card);color:var(--ink);cursor:pointer;text-align:left;font-weight:500}
.opts.h button.opt{flex:1 1 120px;width:auto;justify-content:center;text-align:center}
button.opt:hover{border-color:var(--ink)}
button.opt i{flex:none;width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--ink-3);font-style:normal;font-size:12px;font-weight:700;color:var(--ink-2)}
button.opt.right{border-color:var(--accent);background:var(--accent-bg);font-weight:700;color:var(--ink)}
button.opt.right i{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
button.opt.right::after{content:"정답";margin-left:auto;font-size:12.5px;font-weight:800;color:var(--accent-ink)}
button.opt.mine{border-color:var(--ink);font-weight:700}
button.opt.mine::after{content:"내 선택";margin-left:auto;font-size:12.5px;font-weight:800;color:var(--bad)}
button.opt.dim{color:var(--ink-3)}
/* 한마디로 */
.brief{display:grid;grid-template-columns:72px minmax(0,1fr);margin:0}
.brief dt{font-size:13.5px;font-weight:800;color:var(--accent-ink);padding:12px 0}
.brief dd{margin:0;padding:12px 0;font-size:15px;border-bottom:1px dashed var(--line)}
.brief dt:first-child,.brief dt:first-child+dd{padding-top:0}
.brief dd:last-child{border-bottom:0;padding-bottom:0}
/* 용어 */
.pre{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pre-c{background:var(--paper);padding:16px 18px}
.pre-c b{font-family:var(--f-disp);font-size:17px;font-weight:800}
.pre-c p{margin:6px 0 10px;font-size:14px;color:var(--ink-2);line-height:1.6}
.pre-c a{display:inline-block;font-size:13px;font-weight:700;color:var(--accent-ink);text-decoration:none}
.look{margin:0;font-size:15px;font-weight:700;color:var(--ink)}
/* 숫자 타일 */
.ntiles{display:grid;grid-template-columns:repeat(var(--c,4),minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.nt{background:var(--bg);padding:16px 14px;min-width:0}
.nt span{display:block;font-size:12.5px;color:var(--ink-2);font-weight:600}
.nt b{display:block;font-family:var(--f-disp);font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1.3;margin-top:4px;word-break:keep-all}
.nt b.up{color:var(--bad)}.nt b.dn{color:var(--slate)}
.nt em{display:block;font-style:normal;font-size:12px;color:var(--ink-3);line-height:1.45;margin-top:4px}
/* 그림 */
.fig{margin:0;display:flex;flex-direction:column;gap:12px}
.fig+.fig{border-top:1px solid var(--line);padding-top:18px}
.fig figcaption{display:flex;flex-direction:column;gap:2px}
.fig figcaption b{font-size:15px;font-weight:800}
.fig figcaption span{font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.fbars{display:flex;flex-direction:column;gap:10px}
.fb-row{display:grid;grid-template-columns:minmax(80px,28%) minmax(0,1fr) var(--vw,88px);gap:12px;align-items:center;font-size:13.5px}
.fb-l{color:var(--ink-2);line-height:1.35}
.fb-t{position:relative;height:22px;background:var(--paper)}
.fb-b{position:absolute;top:0;bottom:0;background:var(--ink-3)}
.fb-row.hi .fb-b{background:var(--fill)}
.fb-row.hi .fb-l{color:var(--ink);font-weight:800}
.fb-b.neg{background:var(--bad)}
.fb-zero{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--ink-2)}
.fb-ref{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--slate)}
.fb-v{font-family:var(--f-disp);font-weight:700;font-size:14px;text-align:right;white-space:nowrap}
.fb-v.neg{color:var(--bad)}
.fig-ref{margin:0;font-size:12.5px;color:var(--slate);display:flex;align-items:center;gap:6px}
.fig-ref i{display:inline-block;width:14px;border-top:2px dashed var(--slate)}
.fcmp{display:flex;flex-direction:column;background:var(--paper)}
.fcmp-h,.fcmp-r{display:grid;grid-template-columns:minmax(90px,1.1fr) minmax(0,1fr) 24px minmax(0,1fr);gap:8px;align-items:center;padding:10px 14px}
.fcmp-h{font-size:12.5px;font-weight:700;color:var(--ink-2);border-bottom:1px solid var(--ink)}
.fcmp-h span:last-child{color:var(--accent-ink)}
.fcmp-r{border-top:1px solid var(--line);font-size:14px}
.fcmp-h+.fcmp-r{border-top:0}
.fcmp-l{color:var(--ink-2);font-size:13px}
.fcmp-a{color:var(--ink-2)}
.fcmp-x{color:var(--ink-3);text-align:center}
.fcmp-b{font-weight:800;color:var(--accent-ink)}
.ftl li::before{border-top-color:var(--ink-3)}
.ftl li::after{border-radius:0;border-color:var(--ink-3);transform:rotate(45deg);width:11px;height:11px;top:0}
.ftl li.now::after{background:var(--fill);border-color:var(--fill)}
.ftl li.now .ftl-w{color:var(--accent-ink)}
.fsplit{gap:2px}
.fsplit-k i{border-radius:0}
.fcmp-h,.fsplit i{border-radius:0}
.c1{background:var(--slate)}
.c4{background:color-mix(in srgb,var(--slate) 45%,var(--card))}
/* 인과 사슬 */
.cv .cu{position:relative}
.cv .cu:not(:last-child)::before{content:"";position:absolute;left:19px;top:20px;bottom:-20px;width:3px;background:var(--ink)}
.cs{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);gap:16px;align-items:start;font-size:16px;font-weight:700}
.cs b{position:relative;z-index:1;display:grid;place-items:center;width:40px;height:40px;background:var(--bg);border:3px solid var(--ink);font-family:var(--f-disp);font-weight:800;font-size:16px}
.cs span{min-height:40px;display:flex;align-items:center;line-height:1.5}
.cs.fin b{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.cs.fin span{background:var(--fill);color:var(--on-fill);padding:9px 14px;font-weight:800;justify-self:start;min-height:40px}
.cwhy{margin:0 0 0 56px;padding:10px 0 12px;font-size:14px;color:var(--accent-ink);font-weight:600}
.cwhy::before{content:"↓ ";font-weight:800}
.cside{margin:8px 0 0 56px;padding:10px 14px;background:var(--slate-bg);font-size:14px;line-height:1.6}
.cside small{display:block;font-size:12px;font-weight:800;color:var(--slate)}
.ord{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.ord-msg{margin:12px 0 10px;font-size:14px;color:var(--ink-2);background:var(--paper);padding:9px 12px}
.ord-msg b{color:var(--accent-ink)}
.ord button,.mt-d button{font-size:14.5px;border-radius:2px;border-width:1px}
button.ok-m{border-color:var(--accent)!important;background:var(--accent-bg)!important;color:var(--ink)!important;opacity:.75}
.shake{animation:shake .35s;border-color:var(--bad)!important}
/* 짝 맞추기 */
.mq-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-3);font-weight:800}
.mq-dots{display:flex;gap:3px}.mq-dots i{width:18px;height:4px;border-radius:0;background:var(--line)}
.mq-dots i.on,.mq-dots i.ok{background:var(--fill);width:18px;border-radius:0}
.mq-def{margin:10px 0 12px;padding:16px 18px;border-radius:0;background:var(--paper);border:0}
.mq-n{font-size:12px;font-weight:800;color:var(--accent-ink)}
.mq-opts{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.mq-opts button{border-width:1px;text-align:center;border-radius:2px}
.mq-got li{border-radius:0}
.mq-got b{color:var(--accent-ink)}
/* 이어보기, 끝 */
.vmore{display:flex;flex-direction:column}
.vmore a{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;font-weight:600;text-decoration:none}
.vmore a:first-child{border-top:0;padding-top:0}
.vmore a:hover{color:var(--accent-ink)}
.vmore a span{font-size:12.5px;color:var(--ink-3);font-weight:500;padding-top:2px}
.vmore a.all{font-weight:700;color:var(--accent-ink)}
.vmore a.all span{display:none}
.vmore a.all{display:block}
.vterms{display:flex;flex-direction:column}
.vterms details{border-top:1px solid var(--line);padding:9px 0}
.vterms details:first-child{border-top:0;padding-top:0}
.vterms summary{cursor:pointer;font-weight:600}
.vterms p{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.vhint{margin:20px 0 0;font-size:13.5px;color:var(--ink-2)}
.vhint a{color:var(--accent-ink);font-weight:700}
.vend{margin-top:40px;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink)}
.vend.one{grid-template-columns:1fr}
.vend a{padding:18px 20px;font-size:14.5px;font-weight:700;line-height:1.5;text-decoration:none;color:var(--ink)}
.vend a small{display:block;font-size:12.5px;color:var(--ink-3);font-weight:600;margin-bottom:4px}
.vend a:hover{background:var(--paper)}
.vend a+a,.vend.one a{background:var(--fill);color:var(--on-fill);text-align:right}
.vend a+a{border-left:1px solid var(--ink)}
.vend a+a:hover,.vend.one a:hover{opacity:.92;background:var(--fill)}
.vend a+a small,.vend.one a small{color:color-mix(in srgb,var(--on-fill) 70%,var(--fill))}
.vsrc{margin-top:18px;font-size:12.5px;color:var(--ink-3);line-height:1.7}
.vsrc a{color:var(--ink-2)}
.report{margin-top:14px}
.report summary{cursor:pointer;font-size:13px;color:var(--ink-2)}
.report textarea{margin-top:8px;min-height:72px}
.report .row{margin-top:8px}
/* 오른쪽 학습 순서 */
.iside{position:sticky;top:24px;align-self:start;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 40px);overflow:auto;scrollbar-width:thin}
.vsteps{position:relative;padding:0 0 4px 2px}
.vsteps h5,.vone h5{margin:0 0 12px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.vsteps::before{content:"";position:absolute;left:9px;top:62px;bottom:16px;width:1.5px;background:var(--ink-3);opacity:.5}
.vsteps .g{font-size:11.5px;font-weight:800;color:var(--ink-3);margin:14px 0 6px 26px}
.vsteps .g:first-of-type{margin-top:0}
.vsteps a{position:relative;display:block;padding:5px 0 5px 26px;font-size:14px;color:var(--ink-3);text-decoration:none;line-height:1.5}
.vsteps a::before{content:"";position:absolute;left:4px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--bg);border:1.5px solid var(--ink-3);z-index:1}
.vsteps a:hover{color:var(--ink)}
.vsteps a.ok{color:var(--ink)}
.vsteps a.ok::before{background:var(--fill);border-color:var(--fill)}
.vsteps a.now{color:var(--accent-ink);font-weight:800}
.vsteps a.now::before{left:1px;top:8px;width:14px;height:14px;border:2px solid var(--fill);box-shadow:inset 0 0 0 3px var(--bg);background:var(--fill)}
.vone{background:var(--paper);padding:16px 18px;font-size:14px;line-height:1.65}
.vone h5{margin-bottom:6px}

/* 다른 화면에서 쓰는 목록 상자 (2차에서 다듬어요) */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:2px;padding:18px 20px;min-width:0}
.card .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.card .ttl{font-size:17px;font-weight:700;line-height:1.45;letter-spacing:-.01em;text-wrap:balance;flex:1}
.card .ttl a{text-decoration:none}
.card .ttl a:hover{color:var(--accent-ink)}
.card .stat{font-size:12.5px;color:var(--ink-2)}
.statline{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;font-size:13.5px;color:var(--ink-2);border-top:1px solid var(--line-2);padding-top:14px;margin-top:6px}
.statline b{color:var(--ink);font-weight:800}
.statline .chip{margin-left:auto}
.pill{display:inline-flex;align-items:center;min-height:38px;padding:0 16px;border:1.5px solid var(--accent);border-radius:2px;color:var(--accent-ink);font-size:14px;font-weight:700;text-decoration:none}
.link{padding:10px 14px;border:1px solid var(--line);font-size:14.5px}
@media (max-width:760px){.cards{grid-template-columns:1fr}.card{padding:16px}.statline .chip{margin-left:0}}
.vmore a em{font-style:normal}
.qz{display:flex;flex-direction:column;gap:10px}
.qz+.qz{margin-top:24px}
.qno{font-size:12.5px;font-weight:800;color:var(--ink-3)}
.qz .q{margin:0}
.wrap>*,main,.hm>*,.hmain{min-width:0}
.hmain{max-width:100%}
.cv .cu:not(:last-child):not(.hw){padding-bottom:14px}
/* 아래 고정 탭바와 휴대폰 */
@media (max-width:900px){
  .hm{grid-template-columns:1fr;gap:28px}
  .iss{grid-template-columns:minmax(0,1fr)}
  .iside{display:none}
}
@media (max-width:760px){
  .top .in{padding:0 max(16px,env(safe-area-inset-left,0px));gap:12px;height:56px}
  .logo{font-size:18px}
  .gnav{display:none}
  .top .me{font-size:13.5px}
  .tin{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tabs{gap:20px}
  .page{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
  .side{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
  .side a{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:4px;height:52px;font-size:13px;font-weight:600;color:var(--ink-2);text-decoration:none;border-left:1px solid var(--line)}
  .side a:first-child{border-left:0}
  .side a.on{background:var(--fill);color:var(--on-fill);font-weight:800;border-color:var(--fill)}
  .side .cnt{background:var(--fill);color:var(--on-fill)}
  .side a.on .cnt{background:#F3F3EC;color:#552518}
  .side .dot{display:inline-block;width:6px;height:6px;background:var(--accent);margin-left:2px}
  .side a.on .dot{background:#F3F3EC}
  .hm{display:flex;flex-direction:column;gap:22px;align-items:stretch}
  .haside{display:contents}
  .hrec{order:0}
  .hmain{order:1;min-width:0}
  .hbox,.haside .favbox{order:2}
  .hdate{font-size:34px}
  .hgoal{margin-left:0;width:100%}
  .hgoal .meter{flex:1;width:auto}
  .irow{grid-template-columns:40px minmax(0,1fr);gap:12px}
  .igo{grid-column:2;flex-direction:row}
  .igo a{flex:1}
  .ino{font-size:26px}
  .irow h2{font-size:18px}
  .hrec{padding:16px}
  .hbig b{font-size:34px}
  .imain h1{font-size:23px}
  .vit{grid-template-columns:1fr;gap:4px}
  .vit>.vb{gap:12px}
  .vsh b{font-size:34px}
  .vsh h2{font-size:19px}
  #vprog{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;position:sticky;top:0;background:var(--bg);padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);z-index:5;font-size:12px;font-weight:700;color:var(--ink-3)}
  #vprog:empty{display:none}
  #vprog div::before{content:"";display:block;height:4px;background:var(--line);margin-bottom:6px}
  #vprog div.y{color:var(--accent-ink)}#vprog div.y::before{background:var(--fill)}
  #vprog div.h{color:var(--accent-ink)}#vprog div.h::before{background:linear-gradient(90deg,var(--fill) 50%,var(--line) 50%)}
  .pre{grid-template-columns:1fr}
  .ntiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nt b{font-size:22px}
  .fb-row{grid-template-columns:minmax(0,1fr) var(--vw,80px);gap:4px 10px}
  .fb-l{grid-column:1/-1}
  .fb-t{grid-column:1}
  .fcmp-h{display:none}
  .fcmp-r{grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr);row-gap:2px}
  .fcmp-l{grid-column:1/-1;font-weight:600;color:var(--ink)}
  .ftl{grid-auto-flow:row;grid-auto-columns:auto;padding-left:6px}
  .ftl li{padding:0 0 14px 22px}
  .ftl li::before{top:12px;bottom:-4px;left:5px;right:auto;border-top:0;border-left:2px solid var(--line)}
  .ftl li:last-child::before{display:none}
  .ftl li::after{top:4px;left:0}
  .vend{grid-template-columns:1fr}
  .vend a+a{border-left:0;border-top:1px solid var(--ink)}
  .gauge{grid-template-columns:1fr}
  .brief{grid-template-columns:1fr}
  .brief dt{padding:12px 0 0}
  .brief dd{padding-top:2px}
  .vmore a{grid-template-columns:64px minmax(0,1fr)}
  .imain .cs{font-size:15.5px}
}
@media (prefers-color-scheme:dark){
  .vmode a.on{background:var(--ink);color:var(--bg)}
  .top .me,.gnav a{color:var(--on-top)}
}

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘의 보험 이슈</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22lg%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%237366E6%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%234537B8%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%2211%22%20fill%3D%22url%28%23lg%29%22/%3E%3Cpath%20d%3D%22M8%2020.5C8%2013.6%2013.4%209%2020%209s12%204.6%2012%2011.5c-1.4-1.3-2.7-1.9-4-1.9-1.5%200-2.8.8-4%202.2-1.2-1.4-2.5-2.2-4-2.2s-2.8.8-4%202.2c-1.2-1.4-2.5-2.2-4-2.2-1.3%200-2.6.6-4%201.9z%22%20fill%3D%22%23fff%22/%3E%3Cpath%20d%3D%22M20%2020v9.2a2.6%202.6%200%200%201-5.2%200%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%2231%22%20cy%3D%229.5%22%20r%3D%223.8%22%20fill%3D%22%23FFC83D%22/%3E%3C/svg%3E">
<meta name="description" content="매일 보험 이슈를 예측하고, 숫자로 감 잡고, 인과로 이해하고, 퀴즈로 복습하는 학습 사이트">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 업무 도구처럼 정돈된 화면: 왼쪽 큰 메뉴, 위쪽 밑줄 탭, 굵은 제목과 얇은 선, 초록은 강조에만 */
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --paper:#F5F6F5; --line:#E4E7E5; --line-2:#111413;
  --ink:#111413; --ink-2:#6A716E; --ink-3:#9AA19E;
  --accent:#5B4DDB; --accent-ink:#4134B0; --accent-bg:#EEECFC;
  --warm:#B45309; --warm-bg:#FEF3E2;--mark:#FFE7A0; --good:#047857; --bad:#C2410C;
  --f-body:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-disp:var(--f-body); --f-num:var(--f-body);
  --side:84px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1211; --card:#151918; --paper:#1C2120; --line:#2A302E; --line-2:#E6EAE8;
  --ink:#ECEFEE; --ink-2:#A1AAA6; --ink-3:#6E7773;
  --accent:#9D93F7; --accent-ink:#C3BDFF; --accent-bg:#26214A;
  --warm:#F5B565; --warm-bg:#3A2A14;--mark:rgba(245,181,101,.32); --good:#6EE7B7; --bad:#FB923C; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word;font-feature-settings:"tnum"}
a{color:inherit}
button,select,input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 왼쪽 큰 메뉴 */
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);z-index:10}
.logo{width:40px;height:40px;display:block;margin-bottom:18px;border-radius:11px;box-shadow:0 2px 6px rgba(69,55,184,.28);transition:transform .15s}
.logo:hover{transform:rotate(-6deg)}
.logo svg{width:100%;height:100%;display:block}
.si{position:relative;width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;border-radius:12px;text-decoration:none;color:var(--ink-2);font-size:12px;font-weight:600}
.si svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.si:hover{color:var(--ink);background:var(--paper)}
.si.on{color:var(--accent-ink);background:var(--accent-bg)}
.si .cnt{position:absolute;top:4px;right:10px}
.cnt{font-size:10.5px;font-weight:700;background:var(--warm);color:#fff;border-radius:99px;padding:0 5px;line-height:1.6;min-width:16px;text-align:center}
.side .grow{flex:1}
.si.me .dot{position:absolute;top:8px;right:16px;width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* 위쪽 머리와 탭 */
.page{margin-left:var(--side);min-height:100vh}
.topbar{border-bottom:1px solid var(--line);background:var(--bg)}
.tin,.wrap{max-width:1080px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.tline{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:20px}
.tline .bt{font-weight:800;font-size:16px;letter-spacing:-.01em;text-decoration:none}
.tline .bt em{font-style:normal;color:var(--accent)}
.tline .bt span{font-weight:600;color:var(--ink-2)}
.tline .who{font-size:13px;color:var(--ink-2);text-decoration:none}
.tline .who:hover{color:var(--ink)}
.tabs{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;margin-top:14px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;font-size:14.5px;color:var(--ink-2);text-decoration:none;padding:8px 2px 12px;border-bottom:2px solid transparent;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--ink);border-color:var(--ink);font-weight:700}
.tabs:empty{display:none}
.topbar.single .tline{padding-bottom:18px}

/* 본문 틀 */
.wrap{padding-top:28px;padding-bottom:72px;display:flex;flex-direction:column;gap:24px}
#head{display:flex;flex-direction:column;gap:10px}
#head:empty{display:none}
h1{font-size:28px;line-height:1.35;margin:0;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.meta{font-size:14.5px;color:var(--ink-2);margin:0}
.back{font-size:13.5px;color:var(--ink-2);text-decoration:none;align-self:flex-start}
.back:hover{color:var(--ink)}
main{display:flex;flex-direction:column;gap:20px}
.small{font-size:13px;color:var(--ink-2)}
.small a{color:var(--accent-ink)}
.empty{text-align:center;color:var(--ink-2);padding:40px 0}
.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}

/* 단추와 입력 */
button{font-size:14.5px;padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:left;font-weight:500}
button:hover{border-color:var(--ink-3)}
button:disabled{opacity:.55;cursor:default}
button.pri{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
button.pri:hover{opacity:.9}
button.picked{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-ink);font-weight:600}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
select,input[type=search]{font-size:14.5px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=search]{width:100%;padding:11px 14px}
textarea{width:100%;min-height:96px;font-size:15px;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical;line-height:1.6}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.err{font-size:13px;color:var(--bad)}
.err:empty{display:none}

/* 꼬리표 */
.tag{font-size:12.5px;font-weight:600;color:var(--accent-ink);background:var(--accent-bg);padding:2px 9px;border-radius:6px;align-self:flex-start}
.tag.light{color:var(--warm);background:var(--warm-bg)}
.chip{font-size:13px;font-weight:600;color:var(--accent-ink);text-decoration:none}
.chip:hover{text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .small{margin-right:6px;font-weight:600}
.chips button{font-size:13px;padding:5px 12px;border-radius:99px}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.jobs{display:flex;flex-wrap:wrap;gap:4px}
.jobs span{font-size:12px;color:var(--ink-2);background:var(--paper);border-radius:5px;padding:1px 7px}

/* 오늘 이슈 목록 */
.dnav{display:flex;align-items:center;gap:6px;margin-top:14px}
.darr{flex:none;width:34px;height:52px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);font-size:22px;color:var(--ink);text-decoration:none;background:var(--card)}
.darr:hover{border-color:var(--ink-3)}
.darr.off{opacity:.3;pointer-events:none}
.dstrip{flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;padding:2px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent);mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent)}
.dstrip::-webkit-scrollbar{display:none}
.dmon{flex:none;font-size:12px;font-weight:700;color:var(--ink-3);padding:0 4px 0 10px}
.dchip{flex:none;width:46px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;border-radius:10px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--card);line-height:1.15}
.dchip:hover{border-color:var(--ink-3)}
.dchip b{font-size:15px}
.dchip .dw,.dchip .dn{font-size:10.5px;color:var(--ink-3)}
.dchip.all .dn{color:var(--accent);font-weight:700}
.dchip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dchip.on .dw,.dchip.on .dn{color:inherit;opacity:.75}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.hrow .hl{display:flex;flex-direction:column;gap:6px;min-width:0}
.statline{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;font-size:13.5px;color:var(--ink-2);border-top:1px solid var(--line-2);padding-top:14px;margin-top:6px}
.statline b{color:var(--ink);font-weight:800}
.statline .chip{margin-left:auto}
.daterow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink-2)}
.bar{flex:1;height:6px;border-radius:99px;background:var(--paper);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.card .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.card .ttl{font-size:17px;font-weight:700;line-height:1.45;letter-spacing:-.01em;text-wrap:balance;flex:1}
.card .ttl a{text-decoration:none}
.card .ttl a:hover{color:var(--accent-ink)}
.card .stat{font-size:12.5px;color:var(--ink-2)}
.card .stat.done{color:var(--good);font-weight:700}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cfoot .jobs{margin:0}
.mini-modes{display:flex;gap:6px;margin-left:auto}
.mini-modes.left{margin-left:0}
.mini-modes a{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);text-decoration:none;white-space:nowrap}
.mini-modes a:hover{border-color:var(--ink-3);color:var(--ink)}
.mini-modes a.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.modes{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.seg a{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.seg a:hover{color:var(--ink)}
.seg a.on{background:var(--ink);color:var(--bg)}
.banner{display:flex;justify-content:space-between;align-items:center;gap:6px 16px;flex-wrap:wrap;text-decoration:none;border:1px solid var(--accent);background:var(--accent-bg);color:var(--accent-ink);border-radius:12px;padding:14px 18px;font-size:14px}
.banner b{font-size:15px}
.banner.warm{border-color:var(--warm);background:var(--warm-bg);color:var(--warm)}

/* 구역 */
.step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sh{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.sh .n{font-size:12px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.sh .n+h2{margin-right:auto}
.sh h2{font-size:16px;font-weight:800;margin:0;letter-spacing:-.01em}
.q{margin:0;font-size:16px;font-weight:500}
.reveal{background:var(--paper);border-radius:9px;padding:13px 16px;font-size:14.5px;color:var(--ink-2);white-space:pre-wrap}
.reveal strong{color:var(--ink)}
.fb{white-space:pre-wrap;background:var(--accent-bg);border-radius:9px;padding:13px 16px;font-size:14.5px;color:var(--ink);margin-top:10px}
.fb strong{color:var(--accent-ink)}
.fr{margin:6px 0 0}.fr b{color:var(--accent-ink)}
.gauge{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gauge div{background:var(--paper);border-radius:9px;padding:10px 12px}
.gauge span{display:block;font-size:12.5px;color:var(--ink-2)}
.gauge em{font-style:normal;font-size:22px;font-weight:700}
.nums{display:flex;flex-direction:column}
.nums div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding:11px 0;border-top:1px solid var(--line)}
.nums div:first-child{border-top:0;padding-top:0}
.nums b{font-weight:600;font-size:14.5px}
.nums em{font-style:normal;font-size:16px;font-weight:800;text-align:right}
.nums span{grid-column:1/-1;font-size:13px;color:var(--ink-2)}
.points{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:8px;font-size:15px}
.chain{display:flex;flex-direction:column}
.link{padding:10px 14px;border-left:2px solid var(--accent);font-size:14.5px}
.link+.link{border-top:1px dashed var(--line)}
.src{font-size:13px;color:var(--ink-2)}
.src a{color:var(--accent-ink)}
.next{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.next a{color:var(--ink);font-size:14px;font-weight:600;text-decoration:none}
.next a:hover{color:var(--accent-ink)}
.more{font-size:13.5px;color:var(--accent-ink);text-decoration:none;font-weight:600;align-self:flex-start}
.more:hover{text-decoration:underline}
.report summary{cursor:pointer;font-size:13px;color:var(--ink-2)}
.report textarea{margin-top:8px;min-height:72px}
.report .row{margin-top:8px}

/* 네컷만화 */
.comic{margin:0;display:flex;flex-direction:column;gap:12px}
.comic figcaption b{font-size:16px;font-weight:800}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cp{position:relative;aspect-ratio:320/300;border:2.5px solid #2B2B33;border-radius:6px;overflow:hidden;background:#F1F5FA;min-width:0;container-type:inline-size}
.cp-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cp-o{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;padding:7px;gap:6px;pointer-events:none}
.cp-cap{background:#FFF4B8;color:#2B2B33;border:2px solid #2B2B33;font-size:clamp(11px,4cqw,13.5px);font-weight:700;line-height:1.35;padding:4px 9px;max-width:88%;box-shadow:2px 2px 0 #2B2B33;display:flex;gap:6px}
.cp-cap b{font-weight:900;color:#E0483E}
.cp-cap.only{padding:2px 8px}
.cp-sign{align-self:center;background:#fff;color:#2B2B33;border:2px solid #2B2B33;border-radius:4px;font-size:clamp(11px,4cqw,13.5px);font-weight:900;padding:3px 10px;box-shadow:2px 2px 0 #E0483E;text-align:center;max-width:92%}
.cp-bs{align-self:stretch;display:flex;justify-content:center;gap:6px;margin-top:2px}
.cp-bs.sd{justify-content:flex-end}
.cp-bs.sd .cp-b{max-width:58%}
.cp-bs.n2{justify-content:space-between}
.cp-b{position:relative;background:#fff;color:#2B2B33;border:2.2px solid #2B2B33;border-radius:18px;padding:6px 11px;font-size:clamp(11.5px,4.4cqw,14px);font-weight:700;line-height:1.38;text-align:center;max-width:62%;overflow-wrap:anywhere}
.cp-bs.n2 .cp-b{max-width:49%}
.cp-b::after{content:"";position:absolute;bottom:-11px;width:14px;height:14px;background:#fff;border-right:2.2px solid #2B2B33;border-bottom:2.2px solid #2B2B33;transform:rotate(45deg) skew(8deg,8deg)}
.cp-b.c::after{left:calc(50% - 7px)}
.cp-b.l::after{left:34%}
.cp-b.r::after{right:34%}
.cp-bs.sd .cp-b.r::after{right:auto;left:calc(50% - 7px)}
.cp-b.think{border-radius:50%/46%;padding:9px 14px}
.cp-b.think::after{width:10px;height:10px;border:2.2px solid #2B2B33;border-radius:50%;transform:none;bottom:-15px;box-shadow:none}
.cp-b.think::before{content:"";position:absolute;bottom:-25px;width:6px;height:6px;border:2px solid #2B2B33;border-radius:50%;background:#fff}
.cp-b.think.c::before{left:calc(50% - 10px)}.cp-b.think.l::before{left:30%}.cp-b.think.r::before{right:30%}
.cp-b.shout{border-radius:4px;background:#FFE24D;box-shadow:3px 3px 0 #2B2B33;font-weight:900}
.cp-b.shout::after{background:#FFE24D}
.cp-n{position:absolute;bottom:5px;font-size:clamp(10px,3.4cqw,12px);font-weight:800;color:#2B2B33;background:rgba(255,255,255,.85);border-radius:4px;padding:0 6px;white-space:nowrap}
.cp-n.c{left:50%;transform:translateX(-50%)}.cp-n.s{left:69%;transform:translateX(-50%)}.cp-n.l{left:16%;transform:translateX(-50%)}.cp-n.r{left:84%;transform:translateX(-50%)}
@media (max-width:760px){.cgrid{grid-template-columns:1fr}}
/* 그림 */
.fig{margin:0;display:flex;flex-direction:column;gap:12px}
.fig+.fig{border-top:1px solid var(--line);padding-top:18px}
.fig figcaption{display:flex;flex-direction:column;gap:2px}
.fig figcaption b{font-size:14.5px;font-weight:700}
.fig figcaption span{font-size:12.5px;color:var(--ink-3)}
.fbars{display:flex;flex-direction:column;gap:10px}
.fb-row{display:grid;grid-template-columns:minmax(80px,28%) minmax(0,1fr) 88px;gap:12px;align-items:center;font-size:13.5px}
.fb-l{color:var(--ink-2);line-height:1.35}
.fb-t{position:relative;height:22px;background:var(--paper);border-radius:5px}
.fb-b{position:absolute;top:0;bottom:0;background:var(--ink-3);border-radius:5px}
.fb-row.hi .fb-b{background:var(--accent)}
.fb-row.hi .fb-l{color:var(--ink);font-weight:700}
.fb-b.neg{background:var(--bad)}
.fb-zero{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--ink-2)}
.fb-ref{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--warm)}
.fb-v{font-weight:800;font-size:14px;text-align:right;white-space:nowrap}
.fb-v.neg{color:var(--bad)}
.fig-ref{margin:0;font-size:12.5px;color:var(--warm);display:flex;align-items:center;gap:6px}

.fcmp{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fcmp-h,.fcmp-r{display:grid;grid-template-columns:minmax(90px,1.1fr) minmax(0,1fr) 24px minmax(0,1fr);gap:8px;align-items:center;padding:10px 14px}

.fcmp-r{border-top:1px solid var(--line);font-size:14px}
.fcmp-l{color:var(--ink-2);font-size:13px}
.fcmp-a{color:var(--ink-2)}
.fcmp-x{color:var(--ink-3);text-align:center}
.fcmp-b{font-weight:800}
.ftl{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(120px,1fr);overflow-x:auto;position:relative;padding-top:4px}
.ftl li{position:relative;display:flex;flex-direction:column;gap:2px;padding:20px 10px 0 0}
.ftl li::before{content:"";position:absolute;top:4px;left:0;right:0;border-top:2px solid var(--line)}
.ftl li::after{content:"";position:absolute;top:-1px;left:0;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ink-3)}
.ftl li.now::after{background:var(--accent);border-color:var(--accent)}
.ftl-w{font-size:12.5px;font-weight:800;color:var(--ink-2)}
.ftl li.now .ftl-w{color:var(--accent-ink)}
.ftl-l{font-size:13.5px;line-height:1.45}
.fsplit{display:flex;height:28px;border-radius:7px;overflow:hidden;gap:2px}
.fsplit i{display:block;height:100%}
.c0{background:var(--accent)}.c1{background:var(--warm)}.c2{background:var(--ink-3)}.c3{background:color-mix(in srgb,var(--accent) 45%,var(--card))}.c4{background:color-mix(in srgb,var(--warm) 45%,var(--card))}
.fsplit-k{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.fsplit-k li{display:flex;align-items:center;gap:6px}
.fsplit-k i{width:10px;height:10px;border-radius:3px;display:inline-block}
.fsplit-k b{color:var(--ink);font-weight:800}
.ntiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.nt{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px 15px;min-width:0;overflow:hidden}
.nt::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nt span{font-size:13px;color:var(--ink-2);font-weight:700}
.nt b{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.25;color:var(--accent-ink);word-break:keep-all}
.nt em{font-style:normal;font-size:13px;color:var(--ink-2);line-height:1.55;padding-top:8px;border-top:1px dashed var(--line)}
.flow{display:flex;flex-direction:column;align-items:stretch}
.flow-b{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-size:14.5px}
.flow-b.last{border-color:var(--accent);background:var(--accent-bg)}
.flow-n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.flow-ar{height:18px;position:relative}
.flow-ar::before{content:"";position:absolute;left:24px;top:0;bottom:5px;border-left:2px solid var(--ink-3)}
.flow-ar::after{content:"";position:absolute;left:20px;bottom:0;border:5px solid transparent;border-top:6px solid var(--ink-3);border-bottom:0}
@media (max-width:760px){
  .fb-row{grid-template-columns:minmax(0,1fr) 80px;gap:4px 10px}
  .fb-l{grid-column:1/-1}
  .fb-t{grid-column:1}
  .fcmp-h{display:none}
  .fcmp-r{grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr);row-gap:2px}
  .fcmp-l{grid-column:1/-1;font-weight:600;color:var(--ink)}
  .ftl{grid-auto-flow:row;grid-auto-columns:auto;padding-left:6px}
  .ftl li{padding:0 0 14px 22px}
  .ftl li::before{top:12px;bottom:-4px;left:5px;right:auto;border-top:0;border-left:2px solid var(--line)}
  .ftl li:last-child::before{display:none}
  .ftl li::after{top:4px;left:0}
}
/* 용어 */
button.term{font:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;border-radius:0;border-bottom:1.5px dotted var(--accent);cursor:pointer;text-align:inherit;font-weight:inherit}
mark.em{color:inherit;font-weight:700;background:linear-gradient(transparent 52%,var(--mark) 52%);padding:0 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
button.term:hover{color:var(--accent-ink)}
#pop{position:absolute;z-index:30;background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.12);font-size:14px;display:flex;flex-direction:column;gap:6px}
#pop p{margin:0;color:var(--ink-2)}
#pop a{color:var(--accent-ink);font-size:13px;text-decoration:none;font-weight:600}
.termlist{display:flex;flex-direction:column}
.termlist details{border-top:1px solid var(--line);padding:9px 0}
.termlist details:first-child{border-top:0;padding-top:0}

.termlist p{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.glist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.gitem:hover{border-color:var(--ink-3)}
.gitem b{font-weight:800}
.gitem span{grid-column:1/-1;font-size:13.5px;color:var(--ink-2)}
.gitem em{font-style:normal;font-size:12px;color:var(--accent-ink);font-weight:600;grid-row:1;grid-column:2}

/* 생각의 틀, 이어보기 */
.frs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.frs a{display:flex;flex-direction:column;gap:2px;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.frs a:hover{border-color:var(--ink-3)}
.frs b{font-weight:700;font-size:14.5px}
.frs span{font-size:13px;color:var(--ink-2)}
a.fcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
a.fcard:hover{border-color:var(--ink-3)}
.fcard .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.fcard b{font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.fcard p{margin:0;font-size:14px;color:var(--ink-2)}
.fcard ul{margin:0;padding-left:1.15em;font-size:13.5px;color:var(--accent-ink)}
.tl{list-style:none;margin:0;padding:0 0 0 20px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:20px}
.tl li{position:relative;display:flex;flex-direction:column;gap:4px}
.tl li::before{content:"";position:absolute;left:-27px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.tld{font-size:13px;color:var(--ink-2);font-weight:600}
.tl a{font-weight:700;text-decoration:none;font-size:16px}
.tl a:hover{color:var(--accent-ink)}
.tl p{margin:0;font-size:14px;color:var(--ink-2)}

/* 기초 다지기 */
.blist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line-2)}
.bitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.bitem:hover .bt2 b{color:var(--accent-ink)}
.bn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.bt2 b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.bt2 p{margin:2px 0 0;font-size:14px;color:var(--ink-2)}
.bs{font-size:13px;color:var(--ink-2);font-weight:600;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0;padding-top:0}
.steps a{font-weight:700;text-decoration:none;font-size:15.5px;display:block}
.steps a:hover{color:var(--accent-ink)}
.sn{width:28px;height:28px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.sn.done{background:var(--accent);border-color:var(--accent);color:#fff}
@media (max-width:760px){.bitem{grid-template-columns:auto minmax(0,1fr);gap:12px}.bs{grid-column:2}}
/* 마이페이지 */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stats .stat{background:var(--card);padding:16px 18px;display:flex;flex-direction:column;gap:2px;min-width:0;border-left:1px solid var(--line)}
.stats .stat:first-child{border-left:0}
.stats .stat span{font-size:13px;color:var(--ink-2);font-weight:600}
.stats .stat b{font-size:28px;font-weight:800;letter-spacing:-.02em}
.stats .stat em{font-style:normal;font-size:12px;color:var(--ink-3)}
#account{display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--ink-2)}
#account button{font-size:13.5px;padding:7px 13px}
.authrow{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.authrow b{color:var(--ink);font-weight:700}
.ask{display:flex;flex-direction:column;gap:8px;background:var(--paper);border-radius:9px;padding:12px 14px}
.ask[hidden]{display:none}
.ask p{margin:0;color:var(--ink)}
.notice summary{cursor:pointer;color:var(--ink-2);font-size:13px;font-weight:600}
.notice ul{margin:8px 0 0;padding-left:1.15em;display:flex;flex-direction:column;gap:6px;font-size:13px}
.notice b{color:var(--ink);font-weight:700}
.goalrow{display:flex;align-items:center;gap:8px;font-size:15px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bdg{display:flex;flex-direction:column;gap:1px;border-radius:10px;padding:11px 13px;border:1px solid var(--accent);background:var(--accent-bg);color:var(--accent-ink)}
.bdg b{font-size:14px;font-weight:800}
.bdg span{font-size:12px}
.bdg.off{border-color:var(--line);background:var(--card);color:var(--ink-3)}
.bdg.off b{font-weight:600;color:var(--ink-2)}
.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.links li{display:flex;flex-direction:column;gap:2px;padding:11px 0;border-top:1px solid var(--line)}
.links li:first-child{border-top:0;padding-top:0}
.links a{text-decoration:none;font-weight:600}
.links a:hover{color:var(--accent-ink)}
.wn{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.sh+.wn{border-top:0;padding-top:0}
.wn p{margin:0;font-size:14.5px}
.wn .mine span,.wn .right span{font-size:12px;margin-right:6px}
.tags{display:flex;flex-direction:column;gap:12px}
.tg{display:flex;flex-direction:column;gap:6px}
.tg .bar{flex:none}
.tgh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}
.tgh b{font-weight:700}
.tgh span{color:var(--ink-2);font-size:13px}
.note{border-top:1px solid var(--line);padding:12px 0}
.note:first-of-type{border-top:0;padding-top:0}
.note summary{cursor:pointer;font-size:14.5px;line-height:1.5;font-weight:600}
.note .ans{margin:0 0 8px;background:var(--paper);border-radius:9px;padding:10px 12px;font-size:14.5px;white-space:pre-wrap;font-weight:400}
.rvt{font-size:18px;font-weight:800;text-decoration:none;letter-spacing:-.01em}
.rvt:hover{color:var(--accent-ink)}
.mepane{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.mepane>div{display:flex;flex-direction:column;gap:20px;min-width:0}

/* 달력 */
.cal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead b{font-size:17px;font-weight:800}
.calhead button{padding:3px 12px;font-size:16px;text-align:center}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.wk{font-size:12px;color:var(--ink-2);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper);font-weight:600}
.cd{position:relative;height:clamp(46px,8vw,64px);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:5px 7px;text-decoration:none;color:var(--ink);line-height:1.2;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cd.blank{background:var(--paper)}
.cd b{font-weight:700;font-size:12.5px}
.cd i{font-style:normal;font-size:11.5px;font-weight:700;align-self:flex-end}
.cd u{position:absolute;top:8px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--warm)}
.lv0{background:var(--card)}
.lv1{background:color-mix(in srgb,var(--accent) 16%,var(--card))}
.lv2{background:color-mix(in srgb,var(--accent) 34%,var(--card))}
.lv3{background:color-mix(in srgb,var(--accent) 58%,var(--card))}
.lv4{background:var(--accent)}
.cd.lv3,.cd.lv4{color:#fff}
.cd.today b{background:var(--ink);color:var(--bg);border-radius:99px;padding:0 6px}
.cd.sel{box-shadow:inset 0 0 0 2px var(--ink)}
a.cd:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.cd.met::before{content:"✓";position:absolute;bottom:4px;left:7px;font-size:11px;font-weight:800}
.calfoot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--ink-2)}
.calfoot b{color:var(--ink);font-weight:700}
.legend{display:flex;align-items:center;gap:3px}

.page.read .wrap{max-width:820px}
/* 넓은 화면 */
@media (min-width:1100px){h1{font-size:30px}}
/* 좁은 화면: 왼쪽 메뉴를 아래 탭 막대로 */

  .mepane{grid-template-columns:1fr}

}

  .logo,.side .grow{display:none}

  .tline{padding-top:14px}

/* 경험치 */
.tline .xpchip{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:800;color:#C77800;background:#FFF3D6;border-radius:99px;padding:3px 10px 3px 7px;text-decoration:none}
.tline .xpchip svg{width:14px;height:14px;fill:#FFB82E;stroke:#C77800;stroke-width:1.5;stroke-linejoin:round}

/* 안내 상자 */
.mnote{background:var(--paper);border-radius:14px;padding:12px 14px}

.mnote .chip{display:inline-block;margin-top:6px}
.cele-ic{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:var(--accent);display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1) .1s both}

/* (이전 마스코트) */
.mbox{display:flex;align-items:flex-end;gap:10px}
.mfig{flex:none;width:68px;height:78px}
.mfig svg,.cele-fig svg{width:100%;height:100%;overflow:visible}
.mbub{position:relative;flex:1;min-width:0;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.mbub::before{content:"";position:absolute;left:-8px;bottom:14px;width:14px;height:14px;background:var(--card);border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg)}
.mbub .mname{display:block;font-size:11.5px;font-weight:800;color:#C77800;margin-bottom:2px}

/* 축하 화면 */
.cele{position:fixed;inset:0;z-index:80;background:rgba(15,18,17,.55);display:grid;place-items:center;padding:16px;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}}
.cele-card{position:relative;width:min(380px,100%);background:var(--card);border-radius:22px;padding:22px 20px 18px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}

@keyframes hop{0%,100%{transform:none}40%{transform:translateY(-14px)}}
.cele h2{margin:0;font-size:24px}
.cele-say{margin:6px 0 10px;color:var(--ink-2);font-size:15px}

.cele-btns{display:flex;flex-direction:column;gap:8px}
.cele-btns a,.cele-btns button{text-align:center;text-decoration:none;padding:12px;border-radius:12px;font-weight:700;font-size:15px}
.cele-btns a.pri{background:var(--accent);color:#fff;border:0}

.conf i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
/* 순서·짝 맞추기 */
.ord{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.ord-msg{margin:12px 0 10px;font-size:14px;color:var(--ink-2);background:var(--accent-bg);border-radius:10px;padding:9px 12px}
.ord-msg b{color:var(--accent-ink)}
.ord button,.mt-d button{font-size:14.5px;border-radius:12px;border-width:1.5px;border-bottom-width:3px}
.mt-t{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.mt-t button{font-weight:700;border-radius:99px;border-width:1.5px;border-bottom-width:3px;padding:7px 14px}
.mt-d{display:flex;flex-direction:column;gap:6px}
.mt-d button{font-size:13.5px;color:var(--ink-2)}
.mt-t button.sel{border-color:#5B6CF0;background:rgba(91,108,240,.1);color:var(--ink)}
button.ok-m{border-color:var(--good)!important;background:var(--accent-bg)!important;color:var(--ink)!important;opacity:.75}
.shake{animation:shake .35s;border-color:var(--bad)!important}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
button.lnk{border:0;background:none;padding:0;color:var(--accent);font-weight:700;font-size:inherit}
/* 친구 리그 */
.lg{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.lg li{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px}
.lg li.me{background:var(--accent-bg)}
.lg .rk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--paper)}
.lg .rk.t1{background:#FFD54A;color:#5A4300}.lg .rk.t2{background:#D5DAE1;color:#3B4250}.lg .rk.t3{background:#EDC39A;color:#5A3510}
.lg b{flex:1;min-width:0}.lg em{font-style:normal;font-weight:700;color:#C77800;font-size:14px}
.lg-me b{font-size:40px;font-weight:900;color:#E89A00}.lg-me span{margin-left:4px;font-weight:700}
.wkbars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:110px;align-items:end}
.wkbars div{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.wkbars i{display:block;width:70%;max-width:28px;min-height:3px;background:#FFD27A;border-radius:6px 6px 2px 2px}
.wkbars .on i{background:#FFB82E}
.wkbars em{font-style:normal;font-size:11px;color:var(--ink-2);order:-1}
.wkbars span{font-size:12px;color:var(--ink-2)}.wkbars .on span{font-weight:800;color:var(--ink)}
/* 기초 다지기 길 */
.bwrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;align-items:start}
.bside{position:sticky;top:20px;display:flex;flex-direction:column;gap:14px}
.bsum h2{margin:0 0 10px;font-size:15px}
.bmain{display:flex;flex-direction:column;gap:14px;min-width:0}
.bidx{list-style:none;margin:0;padding:6px;border:1px solid var(--line);border-radius:16px;background:var(--card);display:flex;flex-direction:column}
.bidx a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:14px}
.bidx a:hover{background:var(--paper)}
.bidx i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--u)}
.bidx span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bidx em{font-style:normal;font-size:12px;color:var(--ink-3)}
.bwaits{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.bu.wait{align-items:flex-start;min-height:96px;border-left:4px solid var(--u)}
.bu.wait .bu-t span{-webkit-line-clamp:2;margin-top:2px}
.bu-w{font-style:normal;font-size:12px;font-weight:700;color:var(--ink-3);margin-top:6px}
@media (max-width:900px){.bwrap{grid-template-columns:1fr}.bside{position:static}.bidx{display:none}}
.bsum{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.bsum .mbub{border:0;background:var(--paper);margin-bottom:6px}.bsum .mbub::before{background:var(--paper);border:0}
.bsum-bar{height:10px;border-radius:99px;background:var(--card);margin-top:10px;overflow:hidden}
.bsum-bar i{display:block;height:100%;background:#FFB82E;border-radius:99px}
.bsum .mnote{background:none;padding:0}
.bsum .bsum-bar{background:var(--paper)}
.bsum-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.bgo{background:var(--accent);color:#fff;font-weight:800;font-size:14px;text-decoration:none;padding:8px 16px;border-radius:12px;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.bunit{display:flex;flex-direction:column;gap:6px}
.bu{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;text-decoration:none;color:var(--ink);background:color-mix(in srgb,var(--u) 12%,var(--card));border:1.5px solid color-mix(in srgb,var(--u) 30%,var(--card))}
.bu-n{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--u);color:#fff;font-weight:900;font-size:15px}
.bu-t{flex:1;min-width:0;display:flex;flex-direction:column}
.bu-t b{font-size:16px}
.bu-t span{font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.bu-p{flex:none;font-size:13px;font-weight:800;color:color-mix(in srgb,var(--u) 80%,var(--ink))}
.bu.wait{background:var(--card);border:1.5px solid var(--line);padding:12px 14px}
.bu.wait .bu-n{background:color-mix(in srgb,var(--u) 18%,var(--card));color:var(--u);width:30px;height:30px;font-size:13px;border-radius:9px}
.bu.wait b{font-size:15px;color:var(--ink)}
.bpath{display:flex;flex-direction:column;align-items:center;gap:18px;padding:16px 0 12px}
.bstep{position:relative;display:flex;flex-direction:column;align-items:center;width:170px;transform:translateX(calc(var(--o)*64px))}
.bn{width:64px;height:58px;border-radius:50%;display:grid;place-items:center;border:0;padding:0;cursor:pointer;background:var(--u);box-shadow:0 6px 0 color-mix(in srgb,var(--u) 62%,#000);transition:transform .08s}
.bn:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--u) 62%,#000)}
.bn svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.bn svg .f{fill:#fff;stroke:none}
.bn.done{background:#FFC83D;box-shadow:0 6px 0 #D99A00}
.bn.cur{width:74px;height:68px;outline:7px solid color-mix(in srgb,var(--u) 22%,transparent);outline-offset:3px}
.bn.lock{background:var(--line);box-shadow:0 6px 0 color-mix(in srgb,var(--line) 70%,#000)}
.bn.lock svg{stroke:var(--ink-3)}
.bstart{position:relative;margin-bottom:12px;background:var(--card);color:var(--u);border:2px solid var(--line);font-weight:900;font-size:13px;padding:5px 12px;border-radius:10px;animation:bob 1.6s ease-in-out infinite}
.bstart::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-4px)}}
.bl{margin-top:12px;font-size:13px;font-weight:600;text-align:center;line-height:1.35;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bstep.cur .bl{color:var(--ink);font-weight:800}
.bl.off{color:var(--ink-3);font-weight:500}
@media (max-width:560px){.bstep{transform:translateX(calc(var(--o)*44px))}}
@media (prefers-reduced-motion:reduce){.bstart,.cele-fig,.conf i,.xpt,.cele-card{animation:none}}

/* 기초 다지기 단계 */
.stp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.st{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding-bottom:16px}
.st::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.st:last-child::before{display:none}
.st.done::before{background:var(--u)}
.st-m{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:16px;background:var(--card);border:2px solid var(--line);color:var(--ink-3)}
.st-m svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.st.done .st-m{background:var(--u);border-color:var(--u)}
.st.cur .st-m{background:var(--u);border-color:var(--u);color:#fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--u) 20%,transparent)}
.st.lock .st-m{color:var(--u);border-color:color-mix(in srgb,var(--u) 45%,var(--line))}
.st-c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.st.cur .st-c{border:2px solid var(--u);box-shadow:0 6px 20px color-mix(in srgb,var(--u) 14%,transparent)}
.st.wait .st-c{background:transparent;border-style:dashed}
.st-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;text-decoration:none;color:var(--ink)}
.st-k{font-size:12px;font-weight:800;color:var(--u)}
.st-h b{font-size:16.5px}
.st-b{margin-left:auto;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--paper);color:var(--ink-2)}
.st.cur .st-b{background:var(--u);color:#fff}
.st.done .st-b{background:color-mix(in srgb,var(--u) 15%,var(--card));color:var(--u)}
.st-p{margin:6px 0 0;font-size:13.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st.wait .st-h b{color:var(--ink-2)}
.ss{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.ss li{position:relative}
.ss li:not(:last-child)::after{content:"";position:absolute;left:13px;top:34px;height:calc(100% - 26px);width:2px;background:var(--line)}
.ss li.done:not(:last-child)::after{background:var(--u)}
.ss a,.ss button{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px 6px 0;border:0;background:none;border-radius:10px;text-decoration:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.ss a:hover .ss-t{text-decoration:underline}
.ss-d{position:relative;z-index:1;flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:800;background:var(--paper);color:var(--ink-2)}
.ss-d svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ss li.done .ss-d{background:var(--u);color:#fff}
.ss li.cur .ss-d{background:var(--u);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--u) 22%,transparent)}
.ss li.lock .ss-d{color:var(--ink-3)}
.ss-t{flex:1;min-width:0;font-size:14px;line-height:1.4}
.ss li.cur .ss-t{font-weight:800}
.ss li.lock .ss-t{color:var(--ink-3)}
.ss-go{flex:none;font-size:12.5px;font-weight:800;color:#fff;background:var(--u);padding:5px 11px;border-radius:99px}
@media (max-width:560px){.st{grid-template-columns:34px minmax(0,1fr);gap:10px}.st-m{width:34px;height:34px;font-size:14px}.st::before{left:16px;top:34px}.ss-go{display:none}}

/* 회사별 보기 */
.cochips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cochips a{font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:99px;background:var(--accent-bg);color:var(--accent-ink);text-decoration:none}
.cochips a:hover{text-decoration:underline}
.cosec h2{font-size:16px;margin:18px 0 10px}
.cogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cocard{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:1px;align-items:center;padding:16px 16px 14px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--cc) 9%,var(--card)),var(--card) 60%);text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s,box-shadow .15s}
.cocard::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--cc)}
.cocard:hover{border-color:var(--cc);transform:translateY(-2px);box-shadow:0 8px 20px color-mix(in srgb,var(--cc) 18%,transparent)}
.cocard .comono{grid-row:1/4;grid-column:1}
.cocard>b,.cocard>span:not(.comono),.cocard>em{grid-column:2}
.comono{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--cc);color:var(--ci);font-weight:900;font-size:13px;letter-spacing:-.03em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.comono{position:relative;overflow:hidden}
.comono img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:7px;background:#fff;opacity:0;transition:opacity .2s}
.comono.haslogo{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--cc) 35%,#fff)}
.comono.haslogo img{opacity:1}
.comono.small img{padding:9px;image-rendering:auto}
.comono.big{width:64px;height:64px;border-radius:18px;font-size:18px}
.cohead{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:18px;background:color-mix(in srgb,var(--cc) 10%,var(--card));border:1px solid color-mix(in srgb,var(--cc) 28%,var(--line));margin-top:4px}
.cohead h1{margin:4px 0 0}
.cohead .tag{background:var(--card);color:var(--ink-2)}
.codot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cc);margin-right:6px;vertical-align:1px}
.cocard b{font-size:16px}
.cocard>span:not(.comono){font-size:12.5px;color:var(--ink-2)}
.cocard em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--accent-ink);margin-top:6px}
.cocard.off{background:var(--card)}
.cocard.off .comono{opacity:.55}
.cocard.off::before{opacity:.45}
.cocard.off em{color:var(--ink-3);font-weight:500}
.cotl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:14px}
.cotl li{position:relative;display:flex;flex-direction:column;gap:2px}
.cotl li::before{content:"";position:absolute;left:-25px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.cotl li.done::before{background:var(--accent)}
.cotl-d{font-size:12px;font-weight:700;color:var(--ink-3)}
.cotl a{font-weight:700;color:var(--ink);text-decoration:none}
.cotl a:hover{text-decoration:underline}
.coq{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.coq:first-of-type{border-top:0}

/* 회사 소식 */
.nwl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.nwl li{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.nwl li:first-child{border-top:0;padding-top:4px}
.nw-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nw-d{font-size:12px;font-weight:700;color:var(--ink-3)}
.nw-k{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--paper);color:var(--ink-2)}
.nw-c{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--accent-bg);color:var(--accent-ink);text-decoration:none}
.nw-t{font-size:15.5px}
.nw-x{margin:0;font-size:14px;color:var(--ink-2)}
.nw-p{margin:2px 0 0;font-size:13.5px;background:var(--accent-bg);border-radius:10px;padding:7px 10px}
.nw-p span{font-weight:800;color:var(--accent-ink);margin-right:6px}
.nw-f{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px}
.nw-f a{color:var(--accent-ink);text-decoration:none;font-weight:600}
.nw-f a:hover{text-decoration:underline}

/* 회사 기본 정보 */
.pf{border-top:3px solid var(--cc)}
.pf-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:-4px 0 14px}
.pf-tabs button{border:0;background:none;border-radius:0;padding:8px 12px;font-size:14px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.pf-tabs button.on{color:var(--ink);border-bottom-color:var(--cc);font-weight:800}
.pf-sum{margin:0 0 12px;font-size:16px;font-weight:600}
.pf-facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin:0 0 6px}
.pf-facts div{background:var(--paper);border-radius:12px;padding:10px 12px}
.pf-facts dt{font-size:12px;font-weight:700;color:var(--ink-3)}
.pf-facts dd{margin:2px 0 0;font-size:14px;font-weight:600}
.pf-h{font-size:14.5px;margin:14px 0 6px}
.pf-rn{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.pf-rn b{margin-right:6px}
.pf-tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.pf-src{margin-top:12px}.pf-src ul{margin:6px 0 0;padding-left:18px}.pf-src a{color:var(--accent-ink)}
.pf-empty{border-style:dashed}

/* 회사 페이지 머리와 기본 정보 (다듬은 판) */
.cohero{position:relative;overflow:hidden;border-radius:22px;padding:24px 24px 20px;color:var(--ci);background:linear-gradient(135deg,var(--cc),color-mix(in srgb,var(--cc) 62%,#000));margin-top:6px;box-shadow:0 14px 36px color-mix(in srgb,var(--cc) 28%,transparent)}
.cohero::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.cohero::before{content:"";position:absolute;right:60px;bottom:-110px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06)}
.cohero-top{position:relative;z-index:1;display:flex;align-items:center;gap:16px}
.cohero .comono.big{width:68px;height:68px;border-radius:18px;background:#fff;color:color-mix(in srgb,var(--cc) 72%,#000);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.cohero-tags{display:flex;gap:6px;flex-wrap:wrap}
.cohero-tags span{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--ci) 16%,transparent);color:var(--ci)}
.cohero h1{margin:6px 0 0;color:var(--ci);font-size:32px;letter-spacing:-.02em}
.cohero-sum{position:relative;z-index:1;margin:16px 0 0;font-size:16px;line-height:1.6;color:var(--ci);opacity:.95;max-width:720px}
.cohero-sum mark.em{background:none;color:inherit;font-weight:800;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--ci) 55%,transparent);text-underline-offset:4px}
.cohero-kpi{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:18px}
.cohero-kpi div{background:color-mix(in srgb,var(--ci) 13%,transparent);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;backdrop-filter:blur(2px)}
.cohero-kpi span{font-size:12px;color:var(--ci);opacity:.8}
.cohero-kpi b{font-size:18px;color:var(--ci)}
.pf{border-top:0;padding-top:20px}
.pf-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.pf-head h2{margin:0;font-size:18px}
.pf-head span{font-size:12px;color:var(--ink-3)}
.pf-tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--paper);border:0;margin:0 0 18px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.pf-tabs::-webkit-scrollbar{display:none}
.pf-tabs button{flex:none;border:0;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink-2);background:none;margin:0}
.pf-tabs button.on{background:var(--card);color:var(--ink);font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.pf-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 24px;margin:0}
.pf-facts div{background:none;border-radius:0;padding:11px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:baseline}
.pf-facts dt{font-size:13px;font-weight:700;color:var(--ink-3)}
.pf-facts dd{margin:0;font-size:14.5px;font-weight:600}
.pf-h{font-size:15px;margin:22px 0 10px}
.pf-str{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.pf-str li{counter-increment:s;position:relative;padding:14px 16px 14px 52px;border-radius:14px;background:color-mix(in srgb,var(--cc) 6%,var(--card));border:1px solid color-mix(in srgb,var(--cc) 18%,var(--line));font-size:14.5px;line-height:1.6}
.pf-str li::before{content:counter(s);position:absolute;left:14px;top:13px;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--cc);color:var(--ci);font-weight:900;font-size:13px}
@media (max-width:560px){.cohero{padding:20px 18px 16px}.cohero h1{font-size:26px}.cohero .comono.big{width:56px;height:56px}.pf-facts div{grid-template-columns:64px 1fr}}

/* 주력 상품·인재상 (다듬은 판) */
.pf-prod{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.pp{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);transition:border-color .15s,box-shadow .15s}
.pp:hover{border-color:color-mix(in srgb,var(--cc) 45%,var(--line));box-shadow:0 6px 18px color-mix(in srgb,var(--cc) 12%,transparent)}
.pp-ic,.cu-ic{flex:none;display:grid;place-items:center;border-radius:12px;background:color-mix(in srgb,var(--cc) 14%,var(--card));color:color-mix(in srgb,var(--cc) 60%,var(--ink))}
.pp-ic{width:42px;height:42px}
.pp-ic svg,.cu-ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pp b{font-size:15.5px}
.pp p{margin:4px 0 0;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.pf-talent{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.tl{position:relative;overflow:hidden;padding:18px 18px 16px;border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--cc) 14%,var(--card)),var(--card) 70%);border:1px solid color-mix(in srgb,var(--cc) 22%,var(--line))}
.tl-n{position:absolute;right:14px;top:8px;font-size:40px;font-weight:900;line-height:1;color:color-mix(in srgb,var(--cc) 18%,transparent)}
.tl b{display:block;font-size:22px;letter-spacing:-.02em;color:color-mix(in srgb,var(--cc) 55%,var(--ink))}
.tl p{margin:8px 0 0;font-size:14px;line-height:1.55;color:var(--ink-2)}
.pf-cul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}
.pf-cul li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--paper)}
.cu-ic{width:36px;height:36px;border-radius:10px}
.cu-ic svg{width:19px;height:19px}
.pf-cul p{margin:0;font-size:14px;line-height:1.6;align-self:center}

/* 지원 회사 고정 */
.cowrap{position:relative}
.cowrap .cocard{height:100%}
.favb{position:absolute;top:12px;right:10px;width:34px;height:34px;padding:0;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-3);cursor:pointer}
.favb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.favb:hover{background:var(--paper);color:#E8A400}
.favb.on{color:#E8A400}.favb.on svg{fill:#FFC83D;stroke:#E8A400}
.favb.big{position:relative;top:auto;right:auto;width:auto;height:auto;margin-left:auto;align-self:flex-start;display:flex;gap:6px;align-items:center;padding:7px 12px;border-radius:99px;background:color-mix(in srgb,var(--ci) 16%,transparent);color:var(--ci);font-size:13px;font-weight:700;z-index:1}
.favb.big svg{width:16px;height:16px}
.favb.big.on{background:#fff;color:#8A6200}
.favtip{display:flex;align-items:center;gap:6px}.favtip svg{width:16px;height:16px;fill:#FFC83D;stroke:#E8A400;stroke-width:1.5;flex:none}
.favhint{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1.5px dashed var(--line);text-decoration:none;color:var(--ink-2);font-size:14px}
.favhint svg{width:22px;height:22px;flex:none;fill:#FFE7A0;stroke:#E8A400;stroke-width:1.5}
.favhint b{color:var(--ink);margin-right:6px}
.favbox{display:flex;flex-direction:column;gap:10px}
.favbox .sh{margin:0}.favbox h2{font-size:17px;margin:0}
.favgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.favc{border:1px solid var(--line);border-top:3px solid var(--cc);border-radius:14px;background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.favc-h{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;text-decoration:none;color:var(--ink)}
.favc-h .comono{grid-row:1/3;width:36px;height:36px;border-radius:10px;font-size:11px}
.favc-h b{font-size:15px}.favc-h em{font-style:normal;font-size:12px;color:var(--ink-3)}
.favc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.favc li{font-size:13.5px;line-height:1.45}.favc li span{font-size:11.5px;font-weight:700;color:var(--ink-3);margin-right:6px}
.toast1{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#2B2B33;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;transition:.25s;max-width:calc(100% - 32px)}
.toast1.on{opacity:1;transform:translate(-50%,0)}
/* 모의 면접 */
.mk-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mk-l{width:72px;font-size:14px;font-weight:700;color:var(--ink-2)}
.mk-row select{flex:1;min-width:200px}
.mk-opts{display:flex;gap:6px;flex-wrap:wrap}
.mk-opts button{border-radius:99px;font-size:13.5px;padding:6px 14px}
.mk-opts button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mk-go{padding:12px 22px;font-size:15px}
.mk-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mk-co{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.mk-co .comono{width:32px;height:32px;border-radius:9px;font-size:10.5px}
.mk-prog{font-weight:800;color:var(--accent-ink)}
.mk-bar{height:6px;border-radius:99px;background:var(--paper);margin-top:12px;overflow:hidden}.mk-bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.mk-q{gap:14px}
.mk-kind{align-self:flex-start;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--accent-bg);color:var(--accent-ink)}
.mk-text{margin:0;font-size:20px;font-weight:700;line-height:1.5;letter-spacing:-.01em}
.mk-time{display:flex;align-items:center;gap:10px}
.mk-tb{flex:1;height:8px;border-radius:99px;background:var(--paper);overflow:hidden}.mk-tb i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.mk-tb.low i{background:var(--bad)}
#mkS{font-size:13px;font-weight:800;min-width:48px;text-align:right;color:var(--ink-2)}#mkS.low{color:var(--bad)}
.mk-q textarea{min-height:170px;font-size:15.5px}
.mk-btns{justify-content:flex-end}
.mk-mine{background:var(--paper);border-radius:12px;padding:10px 14px}
.mk-mine span{font-size:12px;font-weight:800;color:var(--ink-3)}
.mk-mine p{margin:4px 0 0;white-space:pre-wrap;font-size:14.5px}
.mk-mine em{color:var(--ink-3)}

/* 영역별 보기 */
.areaf{position:relative;align-self:flex-start}
.areab{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;padding:7px 12px;border-radius:99px;color:var(--ink-2)}
.areab svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.areab.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-bg)}
.areab .caret{font-size:11px;opacity:.7}
.areab[aria-expanded="true"] .caret{transform:rotate(180deg)}
.aream{position:absolute;left:0;top:calc(100% + 6px);z-index:30;min-width:180px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.14);display:flex;flex-direction:column}
.aream[hidden]{display:none}
.aream button{border:0;background:none;border-radius:9px;padding:9px 12px;font-size:14px;text-align:left}
.aream button:hover{background:var(--paper)}
.aream button.on{color:var(--accent-ink);font-weight:800;background:var(--accent-bg)}

/* 담당자 질문 말풍선 */
.rq-sit{margin:0;font-size:14.5px;color:var(--ink-2)}
.rq-bub{position:relative;margin:4px 0 2px 6px;padding:14px 18px;border-radius:4px 18px 18px 18px;background:var(--accent-bg);border:1.5px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.rq-bub::before{content:"";position:absolute;left:-9px;top:-1.5px;width:14px;height:14px;background:var(--accent-bg);border-left:1.5px solid color-mix(in srgb,var(--accent) 35%,transparent);border-top:1.5px solid color-mix(in srgb,var(--accent) 35%,transparent);clip-path:polygon(0 0,100% 0,100% 100%)}
.rq-who{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--accent);padding:2px 9px;border-radius:99px;margin-bottom:6px}
.rq-bub p{margin:0;font-size:16.5px;font-weight:700;line-height:1.6;color:var(--ink)}
.rq-ask{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--paper)}
.rq-ask span{flex:none;font-size:12px;font-weight:800;color:var(--accent-ink);border:1.5px solid var(--accent);border-radius:8px;padding:1px 8px;margin-top:2px}
.rq-ask p{margin:0;font-size:15px;font-weight:600;line-height:1.6}

/* 용어 짝 맞추기 (한 문제씩) */
.mq-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--ink-2);font-weight:600}
.mq-dots{display:flex;gap:5px}.mq-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.mq-dots i.on{background:var(--accent);width:20px;border-radius:99px}.mq-dots i.ok{background:var(--good)}
.mq-def{margin:10px 0 12px;padding:16px 18px;border-radius:16px;background:var(--accent-bg);border:1.5px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.mq-n{font-size:12px;font-weight:800;color:var(--accent-ink)}
.mq-def p{margin:6px 0 0;font-size:16.5px;font-weight:700;line-height:1.6}
.mq-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:6px}
.mq-opts button{text-align:center;font-weight:700;font-size:15px;padding:12px;border-radius:12px;border-width:1.5px;border-bottom-width:3px}
.mq-opts button:hover:not(:disabled){border-color:var(--accent);color:var(--accent-ink)}
.mq-opts button.used{opacity:.35;text-decoration:line-through}
.mq-got{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.mq-got li{display:flex;gap:10px;align-items:baseline;font-size:13.5px;padding:8px 12px;border-radius:10px;background:var(--paper)}
.mq-got b{flex:none;color:var(--good)}.mq-got span{color:var(--ink-2)}
</style>

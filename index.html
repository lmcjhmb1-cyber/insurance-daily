<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘의 보험 이슈</title>
<meta name="description" content="매일 보험 이슈를 예측하고, 숫자로 감 잡고, 인과로 이해하고, 퀴즈로 복습하는 학습 사이트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 계리 노트 한 장: 좁은 단일 열, 단계 번호는 실제 순서, 숫자는 고정폭 */
:root{
  --paper:#F5F6F3; --card:#FFFFFF; --ink:#1B2421; --ink-2:#56625D; --line:#DCE1DD;
  --accent:#17624F; --accent-bg:#E3EFEA; --warm:#9A5B12; --warm-bg:#F6EBDC;
  --good:#1E7A45; --bad:#B23A30;
  --f-disp:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#121816; --card:#1A2220; --ink:#E6ECE9; --ink-2:#9DABA5; --line:#2C3633;
  --accent:#6FC7AA; --accent-bg:#1D3A31; --warm:#E3A85C; --warm-bg:#3A2B17;
  --good:#6FCB92; --bad:#F08A80; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;word-break:keep-all;overflow-wrap:break-word;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--line);padding-bottom:20px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand a.home{font-family:var(--f-disp);font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
select{font:inherit;font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.tag{font-size:13px;color:var(--accent);background:var(--accent-bg);padding:2px 10px;border-radius:99px;align-self:flex-start}
.tag.light{color:var(--warm);background:var(--warm-bg)}
h1{font-family:var(--f-disp);font-size:clamp(24px,5vw,30px);line-height:1.35;margin:0;text-wrap:balance;font-weight:700}
.meta{font-size:14px;color:var(--ink-2)}
.back{font-size:14px;color:var(--accent);text-decoration:none;align-self:flex-start}
.back:hover{text-decoration:underline}
main{display:flex;flex-direction:column;gap:20px}
/* 목록 */
.prog{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--ink-2)}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.cards{display:flex;flex-direction:column;gap:12px}
a.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
a.card:hover{border-color:var(--accent)}
a.card.deep{border-width:1.5px;border-color:var(--accent)}
.card .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.card .ttl{font-family:var(--f-disp);font-size:19px;font-weight:700;line-height:1.45;text-wrap:balance}
.card .stat{font-size:13px;color:var(--ink-2)}
.card .stat.done{color:var(--good);font-weight:600}
div.card{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
div.card .ttl a{color:var(--ink);text-decoration:none}
div.card .ttl a:hover{color:var(--accent)}
/* 깊이 고르기 */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modes a{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.modes a span{font-size:12.5px;font-weight:400;color:var(--ink-2)}
.modes a:hover{border-color:var(--accent)}
.modes a.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.modes a.on.light{border-color:var(--warm);background:var(--warm-bg);color:var(--warm)}
/* 단계 */
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sh{display:flex;align-items:baseline;gap:10px}
.sh .n{font-family:var(--f-num);font-size:13px;color:var(--accent)}
.sh h2{font-size:15px;font-weight:600;margin:0;color:var(--ink-2)}
.q{margin:0;font-size:17px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:15px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;text-align:left}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--card)}
button.picked{border-color:var(--accent);background:var(--accent-bg)}
.reveal{background:var(--paper);border-radius:10px;padding:14px 16px;font-size:15px;color:var(--ink-2);white-space:pre-wrap}
.reveal strong{color:var(--ink)}
.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}
.predict{border-color:var(--warm)} .predict .sh .n{color:var(--warm)}
textarea{width:100%;min-height:96px;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);resize:vertical}
.err{font-size:13px;color:var(--bad)}
.gauge{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gauge div{background:var(--paper);border-radius:10px;padding:10px 12px}
.gauge span{display:block;font-size:13px;color:var(--ink-2)}
.gauge em{font-style:normal;font-family:var(--f-num);font-size:22px;font-variant-numeric:tabular-nums}
.nums{display:flex;flex-direction:column;gap:0}
.nums div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:12px 0;border-top:1px solid var(--line)}
.nums div:first-child{border-top:0;padding-top:0}
.nums b{font-weight:500;font-size:15px}
.nums em{font-style:normal;font-family:var(--f-num);font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.nums span{grid-column:1/-1;font-size:13px;color:var(--ink-2)}
.points{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px;font-size:15.5px}
input[type=range]{width:100%;accent-color:var(--accent)}
.chain{display:flex;flex-direction:column}
.link{padding:10px 14px;border-left:2px solid var(--accent);font-size:15px}
.link+.link{border-top:1px dashed var(--line)}
.small{font-size:13px;color:var(--ink-2)}
.src a{color:var(--accent)}
.empty{text-align:center;color:var(--ink-2);padding:32px 0}
.next{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.next a{color:var(--accent);font-size:15px;text-decoration:none}
/* 학습 달력 */
.cal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead b{font-family:var(--f-disp);font-size:18px}
.calhead button{padding:2px 14px;font-size:20px;line-height:1.4;text-align:center}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk{text-align:center;font-size:12px;color:var(--ink-2);padding-bottom:2px}
.cd{position:relative;height:clamp(42px,11vw,58px);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);line-height:1.25}
.cd.blank{visibility:hidden}
.cd b{font-weight:500;font-size:13px;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.cd i{font-style:normal;font-size:11px;font-weight:600;min-height:1.25em}
.cd u{position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--warm)}
.lv0{background:var(--paper)}
.lv1{background:color-mix(in srgb,var(--accent) 20%,var(--card))}
.lv2{background:color-mix(in srgb,var(--accent) 42%,var(--card))}
.lv3{background:color-mix(in srgb,var(--accent) 68%,var(--card))}
.lv4{background:var(--accent)}
.cd.lv3,.cd.lv4{color:var(--card)}
.cd.today{box-shadow:inset 0 0 0 2px var(--warm)}
.cd.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cd.today.sel{box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 4px var(--warm)}
a.cd:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.calfoot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--ink-2)}
.calfoot b{color:var(--ink);font-weight:600}
.legend{display:flex;align-items:center;gap:3px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* 머리말 이동 */
.melink{font-size:14px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;display:inline-flex;align-items:center;gap:6px}
.melink:hover,.melink.on{border-color:var(--accent);color:var(--accent)}
.melink .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.daterow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;color:var(--accent);background:var(--accent-bg);border-radius:99px;padding:4px 12px;text-decoration:none}
/* 마이페이지 */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stats .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats .stat span{font-size:13px;color:var(--ink-2)}
.stats .stat b{font-family:var(--f-num);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink)}
.stats .stat em{font-style:normal;font-size:12px;color:var(--ink-2)}
.sh{justify-content:space-between}
.sh .n+h2{margin-right:auto}
.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.links li{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.links li:first-child{border-top:0;padding-top:0}
.links a{color:var(--ink);text-decoration:none;font-weight:500}
.links a:hover{color:var(--accent)}
.wn{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.sh+.wn{border-top:0;padding-top:0}
.wn p{margin:0;font-size:15px}
.wn .mine span,.wn .right span{font-size:12px;margin-right:6px}
.more{font-size:14px;color:var(--accent);text-decoration:none;align-self:flex-start}
.tags{display:flex;flex-direction:column;gap:12px}
.tg{display:flex;flex-direction:column;gap:6px}
.tg .bar{flex:none}
.tgh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}
.tgh b{font-weight:600}
.tgh span{color:var(--ink-2);font-size:13px}
.note{border-top:1px solid var(--line);padding:12px 0}
.note:first-of-type{border-top:0;padding-top:0}
.note summary{cursor:pointer;font-size:15px;line-height:1.5}
.note .ans{margin:0 0 8px;background:var(--paper);border-radius:10px;padding:10px 12px;font-size:15px;white-space:pre-wrap}
#account{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink-2)}
#account button{font-size:14px;padding:6px 12px}
/* 메뉴 */
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;font-size:14px;color:var(--ink-2);text-decoration:none;padding:6px 12px;border-radius:99px;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px}
.nav a:hover{color:var(--ink);border-color:var(--line)}
.nav a.on{color:var(--accent);background:var(--accent-bg);font-weight:600}
.cnt{font-size:11px;font-weight:600;background:var(--warm);color:var(--card);border-radius:99px;padding:0 6px;line-height:1.6}
.banner{display:flex;flex-direction:column;gap:2px;text-decoration:none;background:var(--accent-bg);color:var(--accent);border-radius:12px;padding:12px 16px;font-size:14px}
.banner b{font-size:15px}
.banner.warm{background:var(--warm-bg);color:var(--warm)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .small{margin-right:4px}
.chips button{font-size:13px;padding:5px 12px;border-radius:99px;background:var(--card)}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
.jobs{display:flex;flex-wrap:wrap;gap:4px}
.jobs span{font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:0 6px}
input[type=search]{width:100%;font:inherit;font-size:15px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
/* 용어 */
button.term{font:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;border-radius:0;border-bottom:1.5px dotted var(--accent);cursor:pointer;text-align:inherit}
button.term:hover{color:var(--accent);border-color:var(--accent)}
#pop{position:absolute;z-index:20;background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.14);font-size:14px;display:flex;flex-direction:column;gap:6px}
#pop p{margin:0;color:var(--ink-2)}
#pop a{color:var(--accent);font-size:13px;text-decoration:none}
.termlist{display:flex;flex-direction:column}
.termlist details{border-top:1px solid var(--line);padding:8px 0}
.termlist details:first-child{border-top:0;padding-top:0}
.termlist summary{cursor:pointer;font-weight:500}
.termlist p{margin:6px 0 0;font-size:14.5px;color:var(--ink-2)}
.glist{display:flex;flex-direction:column;gap:8px}
.gitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.gitem:hover{border-color:var(--accent)}
.gitem b{font-weight:600}
.gitem span{grid-column:1/-1;font-size:14px;color:var(--ink-2)}
.gitem em{font-style:normal;font-size:12px;color:var(--accent);grid-row:1;grid-column:2}
/* 생각의 틀, 이어보기 */
.frs{display:flex;flex-direction:column;gap:8px}
.frs a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--paper)}
.frs a:hover{border-color:var(--accent)}
.frs b{font-weight:600;font-size:15px}
.frs span{font-size:13px;color:var(--ink-2)}
a.fcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
a.fcard:hover{border-color:var(--accent)}
.fcard .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.fcard b{font-family:var(--f-disp);font-size:18px}
.fcard p{margin:0;font-size:14.5px;color:var(--ink-2)}
.fcard ul{margin:0;padding-left:1.2em;font-size:14px;color:var(--accent)}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--accent);display:flex;flex-direction:column;gap:18px}
.tl li{position:relative;display:flex;flex-direction:column;gap:4px}
.tl li::before{content:"";position:absolute;left:-25px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.tld{font-size:13px;color:var(--ink-2);font-family:var(--f-num)}
.tl a{color:var(--ink);font-weight:600;text-decoration:none;font-size:16px}
.tl a:hover{color:var(--accent)}
.tl p{margin:0;font-size:14.5px;color:var(--ink-2)}
/* 복습, 목표, 배지 */
.rvt{font-family:var(--f-disp);font-size:18px;font-weight:700;color:var(--ink);text-decoration:none}
.goalrow{display:flex;align-items:center;gap:8px;font-size:15px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.bdg{display:flex;flex-direction:column;gap:2px;border-radius:10px;padding:10px 12px;background:var(--accent-bg);color:var(--accent)}
.bdg b{font-size:14px}
.bdg span{font-size:12px}
.bdg.off{background:var(--paper);color:var(--ink-2)}
.bdg.off b{font-weight:500}
.cd.met::before{content:"✓";position:absolute;top:2px;left:5px;font-size:10px;font-weight:700}
.fb{white-space:pre-wrap;background:var(--accent-bg);border-radius:10px;padding:14px 16px;font-size:15px;color:var(--ink);margin-top:10px}
.fb strong{color:var(--accent)}
.fr{margin:6px 0 0}
.fr b{color:var(--accent)}
.report summary{cursor:pointer;font-size:13px;color:var(--ink-2)}
.report textarea{margin-top:8px;min-height:72px}
.report .row{margin-top:8px}
/* 로그인 */
#authbar{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
#authbar:empty{display:none}
.authrow{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.authrow b{color:var(--ink);font-weight:600}
#authbar button{font-size:14px;padding:6px 12px}
button.danger{background:var(--bad);border-color:var(--bad);color:var(--card)}
.ask{display:flex;flex-direction:column;gap:8px;background:var(--paper);border-radius:10px;padding:10px 12px}
.ask p{margin:0;color:var(--ink)}
.ask[hidden]{display:none}
.notice summary{cursor:pointer;color:var(--accent);font-size:13px}
.notice ul{margin:8px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:13px}
.notice b{color:var(--ink);font-weight:600}
@media (max-width:420px){.gauge{grid-template-columns:1fr}.step{padding:16px}a.card{padding:16px}}
@media (prefers-reduced-motion:no-preference){.reveal,.link{animation:in .25s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>
</head>
<body>
<div class="wrap">
  <header id="head"><p class="empty">이슈를 불러오는 중이에요.</p></header>
  <main id="main"></main>
</div>
<script src="issues.js?v=202610302317"></script>
<script src="frames.js?v=202610302317"></script>
<script src="weekly.js?v=202610302317"></script>
<script src="app.js?v=202610302317"></script>
<script type="module" src="sync.js?v=202610302317"></script>
</body>
</html>

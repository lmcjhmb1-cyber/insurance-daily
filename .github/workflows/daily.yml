name: 매일 이슈 올리기

on:
  schedule:
    - cron: "30 20 * * *" # 한국 시간 05:30 (어제 기사를 모아서 바로 이슈로 만들어요)
  workflow_dispatch:
    inputs:
      date:
        description: "날짜 (YYYY-MM-DD, 비우면 한국 시간 어제)"
        required: false
        default: ""
      dry_run:
        description: "연습 실행 (저장소를 바꾸지 않고 결과물만 만들어요)"
        type: boolean
        default: false
      limit_issues:
        description: "이슈 최대 개수 (비우면 7)"
        required: false
        default: ""
      writer_model:
        description: "글쓰기 모델 (고르기, 쓰기, 고치기). 비우면 아래 기본값"
        required: false
        default: ""
      verifier_model:
        description: "검토 모델. 비우면 아래 기본값"
        required: false
        default: ""
      budget_usd:
        description: "하루 예산(달러). 비우면 저장소 변수 DAILY_BUDGET_USD, 그것도 없으면 5"
        required: false
        default: ""
      monthly_note:
        description: "메모 (월 예산 같은 것을 적어두는 칸이에요. 동작에는 쓰이지 않아요)"
        required: false
        default: ""

permissions:
  contents: write

# 겹쳐 돌지 않게 해요 (기다렸다가 차례로)
concurrency:
  group: daily-issues
  cancel-in-progress: false

env:
  # 모델을 바꾸려면 아래 두 줄의 기본값만 고치면 돼요 (claude-sonnet-5-5, claude-opus-5-5, claude-haiku-5-5)
  WRITER_MODEL: ${{ inputs.writer_model || 'claude-sonnet-5-5' }}
  VERIFIER_MODEL: ${{ inputs.verifier_model || 'claude-opus-5-5' }}
  DAILY_BUDGET_USD: ${{ inputs.budget_usd || vars.DAILY_BUDGET_USD || '5' }}

jobs:
  daily:
    # 기본 브랜치에서만 돌아요
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      INPUT_DATE: ${{ inputs.date }}
      INPUT_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      INPUT_LIMIT: ${{ inputs.limit_issues }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: 날짜 정하기와 입력 확인
        run: |
          D="${INPUT_DATE:-$(TZ=Asia/Seoul date -d yesterday +%F)}"
          if ! echo "$D" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::날짜는 YYYY-MM-DD 모양이어야 해요: $D"
            exit 1
          fi
          if [ -n "$INPUT_LIMIT" ] && ! echo "$INPUT_LIMIT" | grep -Eq '^[0-9]+$'; then
            echo "::error::이슈 최대 개수는 숫자여야 해요: $INPUT_LIMIT"
            exit 1
          fi
          echo "DATE=$D" >> "$GITHUB_ENV"
          echo "날짜 $D, 글쓰기 모델 $WRITER_MODEL, 검토 모델 $VERIFIER_MODEL, 하루 예산 $DAILY_BUDGET_USD 달러, 연습 실행 $INPUT_DRY_RUN"

      - name: 비밀값 확인
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY 비밀값이 없어요. 저장소 설정(Settings > Secrets and variables > Actions)에 넣어주세요."
            exit 1
          fi

      - name: 파이프라인 설치
        run: npm ci
        working-directory: pipeline

      - name: 기사 후보 모으기
        run: node scripts/collect.mjs "$DATE"

      - name: 후보 올리기
        if: env.INPUT_DRY_RUN != 'true'
        run: |
          if [ -z "$(git status --porcelain candidates)" ]; then
            echo "후보 파일은 바뀐 것이 없어요."
            exit 0
          fi
          N=$(node -e 'const f=process.argv[1];console.log(JSON.parse(require("fs").readFileSync(f,"utf8")).items.length)' "candidates/$DATE.json")
          git config user.name "lmcjhmb1-cyber"
          git config user.email "lmcjhmb1@gmail.com"
          git add candidates
          git commit -m "기사 후보 모으기: ${DATE} (${N}건)"
          for i in 1 2 3; do
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            echo "푸시 실패, 다시 시도해요 ($i/3)"
            git pull --rebase origin "$DEFAULT_BRANCH"
          done
          echo "::error::후보 파일 푸시에 계속 실패했어요."
          exit 1

      - name: 이슈 만들기
        id: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=(--date "$DATE")
          [ "$INPUT_DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          [ -n "$INPUT_LIMIT" ] && ARGS+=(--limit-issues "$INPUT_LIMIT")
          # 기사 본문은 파일로 남기지 않아요. 결과 폴더에는 만든 글(payload)과 요약만 있어요.
          node pipeline/run.mjs "${ARGS[@]}" --output-dir "pipeline/out/$DATE"

      - name: 커밋하고 올리기
        if: env.INPUT_DRY_RUN != 'true' && steps.pipeline.outputs.changed == 'true'
        env:
          ISSUES: ${{ steps.pipeline.outputs.issues }}
          NEWS: ${{ steps.pipeline.outputs.news }}
        run: |
          PAYLOAD="pipeline/out/$DATE/payload.json"
          MSG="이슈 올리기: ${DATE} (이슈 ${ISSUES}개, 회사 소식 ${NEWS}건)"
          git config user.name "lmcjhmb1-cyber"
          git config user.email "lmcjhmb1@gmail.com"
          FILES="issues.js news.js weekly.js index.html data"
          git add $FILES
          if git diff --cached --quiet; then
            echo "바뀐 것이 없어요."
            exit 0
          fi
          git commit -m "$MSG"
          for i in 1 2 3; do
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            echo "푸시 거절, 최신 상태 위에서 다시 합쳐요 ($i/3)"
            git fetch origin "$DEFAULT_BRANCH"
            git reset --hard "origin/$DEFAULT_BRANCH"
            node scripts/merge.mjs "$PAYLOAD" --bump
            node scripts/check.mjs --since "$DATE" || { echo "::error::다시 합친 뒤 검사에 실패했어요."; exit 1; }
            git add $FILES
            git commit -m "$MSG"
          done
          echo "::error::푸시에 계속 실패했어요."
          exit 1

      - name: 결과 올려두기 (만든 글과 요약만, 기사 본문 없음)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-${{ env.DATE }}
          path: pipeline/out/${{ env.DATE }}
          retention-days: 7
          if-no-files-found: ignore

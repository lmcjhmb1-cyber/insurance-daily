name: 데이터 나누기

on:
  push:
    branches: [main]
    paths:
      - "issues.js"
      - "lessons.js"
      - "profiles.js"
      - "companies.js"
      - "scripts/build-data.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 데이터 나누기
        run: node scripts/build-data.mjs
      - name: 바뀐 것이 있으면 올리기
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "바뀐 것이 없어요."
            exit 0
          fi
          git config user.name "lmcjhmb1-cyber"
          git config user.email "lmcjhmb1@gmail.com"
          git add -A data
          git commit -m "데이터 나누기: 자동 생성"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "푸시 실패, 다시 시도해요 ($i/3)"
            git pull --rebase origin main
          done
          echo "푸시에 계속 실패했어요."
          exit 1

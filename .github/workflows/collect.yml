name: 기사 후보 모으기
# 매일 자동 실행은 "매일 이슈 올리기"(daily.yml)가 맡아요. 여기는 직접 눌러서 모을 때만 써요.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "모을 날짜 (YYYY-MM-DD, 비우면 어제)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 기사 후보 모으기
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: node scripts/collect.mjs $INPUT_DATE
      - name: 바뀐 것이 있으면 올리기
        run: |
          if [ -z "$(git status --porcelain candidates)" ]; then
            echo "바뀐 것이 없어요."
            exit 0
          fi
          F=$(ls -t candidates/*.json | head -1)
          D=$(basename "$F" .json)
          N=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).items.length)' "$F")
          git config user.name "lmcjhmb1-cyber"
          git config user.email "lmcjhmb1@gmail.com"
          git add candidates
          git commit -m "기사 후보 모으기: ${D} (${N}건)"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "푸시 실패, 다시 시도해요 ($i/3)"
            git pull --rebase origin main
          done
          echo "푸시에 계속 실패했어요."
          exit 1
